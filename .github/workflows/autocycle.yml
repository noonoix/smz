name: AutoCycle integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v32-profile-and-bundle
    paths:
      - 'ams-shell/**'
      - 'tools/AMSBoardPrep/**'
      - '.github/workflows/autocycle.yml'
  pull_request:
    paths:
      - 'ams-shell/**'
      - 'firmware/arm26/**'
      - 'firmware/autocycle-hostusb-v5/**'
      - 'firmware/pico-light-guard-1.0.0/**'
      - 'portable/plan3/**'
      - 'tests/LightTelemetryTests/**'
      - 'tools/ClassroomStudio.Companion/**'
      - 'tools/ClassroomStudio.Companion.ContractTests/**'
      - '.github/workflows/autocycle.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  portable-contracts:
    name: autocycle / portable contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run every portable contract
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m py_compile portable/plan3/CIRCUITPY/*.py
            python -m py_compile portable/plan3/CIRCUITPY-SPLIT/*.py
            python -m py_compile portable/plan3/tools/*.py portable/plan3/sim/*.py
            count=0
            for test in portable/plan3/sim/test_*.py; do
              echo "=== $test ==="
              python "$test"
              count=$((count + 1))
            done
            test "$count" -gt 0
            echo "AutoCycle contract files passed: $count"
          } 2>&1 | tee autocycle-portable.log
      - name: Report portable failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('autocycle-portable.log') ? fs.readFileSync('autocycle-portable.log','utf8') : '(no log)';
            const tail = log.split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-portable-failure -->\n**AutoCycle portable failure tail**\n```\n'+tail+'\n```'});

  windows-app:
    name: autocycle / Windows app build-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore ams-shell/AMS.sln 2>&1 | Tee-Object windows-restore.log
      - name: Build Classroom Studio
        shell: pwsh
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object windows-build.log
      - name: Verify Combined Guard runtime files in Windows output
        shell: pwsh
        run: |
          $out = 'ams-shell/src/Ams.UI/bin/Release/net8.0-windows'
          $required = @(
            'portable-runtime/plan_engine.py',
            'portable-runtime/live_light_guard.py',
            'portable-runtime/guard_transition.py',
            'portable-runtime/guard_calibration_protocol.py',
            'portable-runtime/error_policy.py',
            'portable-runtime/combined_guard_runtime.py',
            'combined-runtime/code.py',
            'combined-runtime/boot.py'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $out $_)) })
          if ($missing.Count -gt 0) {
            Write-Error ('Missing Combined Guard runtime files: ' + ($missing -join ', '))
            exit 1
          }
          Write-Host 'All required Combined Guard runtime files are present:'
          $required | ForEach-Object { Write-Host (' - ' + (Join-Path $out $_)) }
      - name: Build TestRunner from a clean tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object windows-testrunner-build.log
      - name: Run TestRunner and reject any failure
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path windows-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Run typed light telemetry tests
        shell: pwsh
        run: |
          dotnet run --project tests/LightTelemetryTests/LightTelemetryTests.csproj -c Release 2>&1 | Tee-Object light-telemetry-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path light-telemetry-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Build and stage software-only companion
        if: success()
        shell: pwsh
        run: |
          $out = 'ams-shell/src/Ams.UI/bin/Release/net8.0-windows'
          $companion = Join-Path $out 'ClassroomStudio.Companion'
          dotnet publish tools/ClassroomStudio.Companion/ClassroomStudio.Companion.csproj -c Release -r win-x64 --self-contained false -o $companion 2>&1 | Tee-Object companion-publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools/ClassroomStudio.Companion/README.md (Join-Path $companion 'README.md') -Force
          @(
            'Classroom Studio companion MCP v0.1',
            'Software-only UI Automation, screenshots, logs, export staging, and hash validation.',
            'No serial, USB, HID, firmware flashing, reset, actuator, Guard, Run/Stop, or release operations.',
            'No hardware connection or physical test is performed by this artifact.'
          ) | Set-Content (Join-Path $companion 'SCOPE.txt') -Encoding utf8
      - name: Stage Windows test output
        if: success()
        shell: pwsh
        run: |
          $out = 'ams-shell/src/Ams.UI/bin/Release/net8.0-windows'
          Remove-Item -Recurse -Force "$out/bridge/__pycache__" -ErrorAction SilentlyContinue
          @(
            'Classroom Studio — Phase 6 non-executing authorization diagnostics test build',
            'Source commit: ${{ github.event.pull_request.head.sha }}',
            'Diagnostic build only; actuator and all execution paths remain disabled.',
            'Status Live Watch and manual Arm/Issue/Consume are diagnostic-only.'
          ) | Set-Content "$out/LIGHT-STATE-TEST.txt" -Encoding utf8
      - name: Upload gated Windows output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: light-state-windows-output
          path: |
            ams-shell/src/Ams.UI/bin/Release/net8.0-windows/**
            windows-tests.log
            light-telemetry-tests.log
            companion-publish.log
          retention-days: 14
          if-no-files-found: error
      - name: Report Windows failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const names=['windows-restore.log','windows-build.log','windows-testrunner-build.log','windows-tests.log','light-telemetry-tests.log','companion-publish.log'];
            const text=names.map(n=>fs.existsSync(n)?('=== '+n+' ===\n'+fs.readFileSync(n,'utf8')):'').join('\n');
            const lines=text.split('\n');
            const failures=lines.filter(line=>line.includes('FAIL:')||line.includes('Unhandled exception')||line.includes('Results:')).join('\n');
            const tail=lines.slice(-100).join('\n');
            const report=(failures?'=== failure markers ===\n'+failures+'\n':'')+'=== tail ===\n'+tail;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-windows-failure -->\n**AutoCycle Windows failure diagnostics**\n```\n'+report+'\n```'});

  test-package:
    name: autocycle / downloadable test package
    if: (github.event_name == 'push' && github.ref_name == 'fix/v32-profile-and-bundle') || (github.event_name == 'pull_request' && (github.head_ref == 'feature/light-state-profiles' || github.head_ref == 'phase6/non-executing-authorization-diagnostics' || github.head_ref == 'fix/v32-profile-and-bundle'))
    needs: [portable-contracts, windows-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: light-state-windows-output
          path: staged
      - name: Package and hash
        shell: bash
        run: |
          set -euo pipefail
          cd staged/ams-shell/src/Ams.UI/bin/Release/net8.0-windows
          zip -qr ../../../../../../../Classroom-Studio-phase6-diagnostics-test.zip .
          cd ../../../../../../../
          sha256sum Classroom-Studio-phase6-diagnostics-test.zip | awk '{print toupper($1)}' > phase6-diagnostics-test-sha256.txt
          cat > TEST-GUIDE-FA.md <<'EOF'
          # راهنمای تست آزمایشی Phase 6

          1. فایل ZIP را Extract کنید؛ برنامه را مستقیماً از داخل ZIP اجرا نکنید.
          2. `ClassroomStudio.exe` را اجرا کنید.
          3. وارد بخش «وضعیت» شوید.
          4. ابتدا ظاهر کارت، هشدار «فقط تشخیصی — بدون اجرا» و وضعیت دکمه‌ها را بررسی کنید.
          5. سپس فقط سنسور read-only مجاز را وصل کنید و Live Watch را بررسی کنید.
          6. Arm، Issue و Consume را فقط دستی انجام دهید.
          7. هرگونه Macro، کلیک، تایپ، HID، BEEP، Launch، Recovery یا actuator باید غیرفعال بماند.

          این نسخه آزمایشی است؛ Release نهایی نیست و actuator در این فاز مجاز نیست.
          EOF
          {
            echo '# Phase 6 non-executing authorization diagnostics — test build'
            echo
            echo 'Source PR: #174'
            echo
            echo "Source commit: ${{ github.event.pull_request.head.sha }}"
            echo
            echo "SHA-256: $(cat phase6-diagnostics-test-sha256.txt)"
            echo
            echo 'Portable, Windows, TestRunner and typed light-telemetry gates passed before packaging.'
            echo 'This is a prerelease diagnostic package; no actuator or execution path is enabled.'
          } > release-body.md
      - name: Publish prerelease test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase6-diagnostics-test-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "Phase 6 diagnostics test #${{ github.run_number }}"
          prerelease: true
          body_path: release-body.md
          files: |
            Classroom-Studio-phase6-diagnostics-test.zip
            phase6-diagnostics-test-sha256.txt
            TEST-GUIDE-FA.md
            staged/windows-tests.log
            staged/light-telemetry-tests.log
