name: Apply light telemetry protocol

on:
  workflow_dispatch:
  push:
    branches: [feature/light-telemetry-protocol]
    paths:
      - 'tools/apply_light_telemetry_protocol.py'
      - 'tools/test_light_telemetry_protocol.py'
      - '.github/workflows/apply-light-telemetry-protocol.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply LUX telemetry contract
        run: python tools/apply_light_telemetry_protocol.py
      - name: Test telemetry, legacy commands and AutoCycle parity
        run: python tools/test_light_telemetry_protocol.py
      - name: Compile-check maintained firmware sources
        run: python -m py_compile firmware/pico-light-0.9.60-template.py firmware/code64f/code.py firmware/autocycle-hostusb-v5/code.pre-autocycle.py firmware/autocycle-hostusb-v5/code.py
      - name: Commit generated source updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Light telemetry source is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs firmware/pico-light-0.9.60-template.py firmware/code64f/code.py firmware/autocycle-hostusb-v5/code.pre-autocycle.py firmware/autocycle-hostusb-v5/code.py portable/plan3/autocycle_h6_patch.json
          git commit -m 'feat: synchronize light telemetry firmware outputs'
          git push origin HEAD:feature/light-telemetry-protocol
