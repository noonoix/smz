name: Apply release 0.9.65
on:
  push:
    branches: [chore/version-pins-0965]
permissions:
  contents: write
jobs:
  release-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - name: Apply release pins
        shell: pwsh
        run: |
          python tools/patch_version_pins_0965.py
          if($LASTEXITCODE -ne 0){throw 'release patch failed'}
          if(-not (Select-String -Quiet -Path ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs -SimpleMatch 'BundleVersion = "0.9.64f"')){throw 'bundle version moved'}
          if(-not (Select-String -Quiet -Path ams-shell/src/Ams.UI/Ams.UI.csproj -SimpleMatch '<Version>0.9.65</Version>')){throw 'app version missing'}
      - name: Full TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
          dotnet run --project tests/TestRunner.csproj -c Release
      - name: Commit release tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/apply-release-0965.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): set version 0.9.65'
          git push
