name: Mirror rescue

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - phase7/light-guard-calibration
    paths:
      - .github/workflows/mirror-rescue.yml

permissions:
  contents: read

env:
  TARGET_REPOSITORY: ${{ vars.MIRROR_TARGET }}

jobs:
  mirror:
    name: Mirror all refs and preserve bundle
    runs-on: ubuntu-latest
    if: ${{ vars.MIRROR_TARGET != '' }}
    steps:
      - name: Validate mirror configuration
        shell: bash
        env:
          TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_REPOSITORY}" ]]; then
            echo "MIRROR_TARGET repository variable is missing" >&2
            exit 1
          fi
          if [[ ! "${TARGET_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "MIRROR_TARGET must look like owner/repo" >&2
            exit 1
          fi
          if [[ -z "${TOKEN}" ]]; then
            echo "MIRROR_PUSH_TOKEN secret is missing" >&2
            exit 1
          fi
          echo "Mirror target is configured."

      - name: Clone source as mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source.git
          cd source.git
          git show-ref --head | sort > ../SOURCE-REFS.txt
          git bundle create ../smc-1-complete-rescue.bundle --all
          git bundle verify ../smc-1-complete-rescue.bundle

      - name: Push mirror to target
        shell: bash
        env:
          TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          cd source.git
          git remote set-url --push origin "https://x-access-token:${TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push --mirror origin

      - name: Write rescue manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source=${GITHUB_REPOSITORY}"
            echo "source_sha=${GITHUB_SHA}"
            echo "target=${TARGET_REPOSITORY}"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum smc-1-complete-rescue.bundle
          } > RESCUE-MANIFEST.txt
          cat RESCUE-MANIFEST.txt

      - name: Upload git bundle backup
        uses: actions/upload-artifact@v4
        with:
          name: smc-1-complete-rescue-bundle
          path: |
            smc-1-complete-rescue.bundle
            SOURCE-REFS.txt
            RESCUE-MANIFEST.txt
          if-no-files-found: error
