name: Light telemetry protocol validation

on:
  pull_request:
    paths:
      - 'ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs'
      - 'firmware/pico-light-0.9.60-template.py'
      - 'firmware/code64f/code.py'
      - 'firmware/autocycle-hostusb-v5/code.pre-autocycle.py'
      - 'firmware/autocycle-hostusb-v5/code.py'
      - 'portable/plan3/autocycle_h6_patch.json'
      - 'tools/test_light_telemetry_protocol.py'
      - '.github/workflows/light-telemetry.yml'
  push:
    branches: [main]
    paths:
      - 'ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs'
      - 'firmware/pico-light-0.9.60-template.py'
      - 'firmware/code64f/code.py'
      - 'firmware/autocycle-hostusb-v5/code.pre-autocycle.py'
      - 'firmware/autocycle-hostusb-v5/code.py'
      - 'portable/plan3/autocycle_h6_patch.json'
      - 'tools/test_light_telemetry_protocol.py'
      - '.github/workflows/light-telemetry.yml'

permissions:
  contents: read

jobs:
  contract:
    name: telemetry / firmware contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test telemetry behavior, legacy commands and AutoCycle parity
        run: python tools/test_light_telemetry_protocol.py
      - name: Compile-check maintained firmware sources
        run: python -m py_compile firmware/pico-light-0.9.60-template.py firmware/code64f/code.py firmware/autocycle-hostusb-v5/code.pre-autocycle.py firmware/autocycle-hostusb-v5/code.py
