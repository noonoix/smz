name: Apply final stale step-count correction
on:
  push:
    branches:
      - feature/error-step-timeout-ui
    paths:
      - .github/workflows/patch-count-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stale assertion
        run: |
          sed -i 's/Assert(v43insert.Count == 24,/Assert(v43insert.Count == 25,/' tests/TestRunner.cs
          grep -n 'v43insert.Count' tests/TestRunner.cs
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/TestRunner.cs
          git commit -m "Correct insertion-surface step-count assertion"
          git push
