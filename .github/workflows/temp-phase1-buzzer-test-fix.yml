name: temp-phase1-buzzer-test-fix
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'phase1/configurable-buzzer-gpio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo, branch=context.payload.pull_request.head.ref, path='tests/TestRunner.cs';
            const f=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            const s=Buffer.from(f.data.content,'base64').toString('utf8');
            const old='        var buzFw = V27ReadSrc(Path.Combine("Services", "PicoFirmwareExporter.cs"));\n        Assert(buzFw.Contains("PWMOut(board.GP6") && !buzFw.Contains("PWMOut(board.GP5") && !buzFw.Contains("board.D9"),\n            "custom buzzer: passive PWM is Pico GP6 only");';
            const neu='        var buzFw = V27ReadSrc(Path.Combine("Services", "PicoFirmwareExporter.cs"));\n        var buzGp6 = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "TEST", buzzerGpio: "GP6");\n        var buzGp7 = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "TEST", buzzerGpio: "GP7");\n        Assert(buzFw.Contains("PWMOut(board.__BUZZER_GPIO__")\n               && buzGp6.Contains("PWMOut(board.GP6")\n               && buzGp7.Contains("PWMOut(board.GP7")\n               && !buzGp7.Contains("PWMOut(board.GP6")\n               && !buzFw.Contains("PWMOut(board.GP5")\n               && !buzFw.Contains("board.D9"),\n            "custom buzzer: passive PWM uses the selected Pico GPIO (GP6 default, GP7 supported)");';
            if(!s.includes(old)) throw new Error('stale buzzer assertion not found');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:'fix: update buzzer contract test',content:Buffer.from(s.replace(old,neu),'utf8').toString('base64'),sha:f.data.sha});
