name: build-test-package

# Classroom Studio CI — every push to main builds the WPF app on a free Windows
# runner, runs TestRunner, and only packages when ALL tests are green.
# Green -> a GitHub Release appears with the zip (visible via the releases API).
# Red   -> an Issue opens naming the failed step + smoke output + test log tail.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # publish the green-build release
  issues: write     # open an issue when CI fails
  actions: read     # read step conclusions for the failure issue

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # v0.9.58 lesson: NEVER ship a bridge.py that does not compile
      - name: Compile-check bridge.py
        run: python -m py_compile ams-shell/bridge/bridge.py

      # stronger: the bridge must actually START and answer (catches missing imports).
      # The pipe is HELD OPEN for 1.5s after the ping: the bridge's worker thread needs
      # a beat to print pong before stdin EOF would shut the process down.
      - name: Smoke-run bridge.py (ping_bridge)
        shell: pwsh
        run: |
          $out = ('{"op":"ping_bridge"}'; Start-Sleep -Milliseconds 1500) | python ams-shell/bridge/bridge.py 2>&1 | Out-String
          $out | Out-File smoke-output.txt -Encoding utf8
          if ($out -notmatch '"pong"') { Write-Host $out; exit 1 }

      - name: Restore
        run: dotnet restore ams-shell/AMS.sln

      - name: Build (Release)
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore

      # fresh filename on purpose: the repo carries historical test-output.txt files
      # and a stale one must never be mistaken for this run's log.
      - name: Run TestRunner
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner -c Release | Tee-Object ci-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path ci-test-output.txt -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Package release zip
        if: success()
        shell: pwsh
        run: |
          $out = "ams-shell/src/Ams.UI/bin/Release/net8.0-windows"
          Remove-Item -Recurse -Force "$out/bridge/__pycache__" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "Classroom-Studio-release.zip" -Force
          (Get-FileHash Classroom-Studio-release.zip -Algorithm SHA256).Hash | Out-File sha256.txt -Encoding ascii
          $results = (Select-String -Path ci-test-output.txt -Pattern '=== Results' | Select-Object -Last 1).Line
          @("**Tests:** $results", "", "**SHA256:** $(Get-Content sha256.txt -Raw)") | Out-File release_body.md -Encoding utf8

      - name: Publish green-build release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: "CI green — run #${{ github.run_number }}"
          body_path: release_body.md
          files: |
            Classroom-Studio-release.zip
            sha256.txt
            ci-test-output.txt

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; } };
            const tail = read('ci-test-output.txt').split('\n').slice(-60).join('\n');
            const smoke = read('smoke-output.txt');
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const steps = jobs.data.jobs.flatMap(j => (j.steps || []).map(s =>
              `${s.conclusion === 'success' ? 'PASS' : (s.conclusion === 'failure' ? 'FAIL' : 'skip')} — ${s.name}`)).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed — run #${context.runNumber}`,
              body: '**Steps:**\n' + steps
                + '\n\n**Bridge smoke output:**\n```\n' + (smoke || '(no smoke output)') + '\n```'
                + '\n\n**Test log tail:**\n```\n' + (tail || '(no test log — failure before the test step)') + '\n```'
            });
