name: Restore CI-66 UI contract

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the CI green run 66 UI sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          REF=6feff5f5242a1d2ee996eee0f43e3096c5fdcb6d
          git checkout "$REF" -- \
            ams-shell/src/Ams.UI/MainWindow.xaml \
            ams-shell/src/Ams.UI/MainWindow.AutoCycleUi.cs \
            ams-shell/src/Ams.UI/ViewModels/MainViewModel.cs \
            ams-shell/src/Ams.UI/Models/StepDefinitions.cs \
            ams-shell/src/Ams.UI/Models/RecoveryCallStepDefinitions.cs \
            ams-shell/src/Ams.UI/Services/RunEngine.cs \
            ams-shell/src/Ams.UI/Views/OptionsDialog.xaml \
            tests/TestRunner.cs
          if [ -f ams-shell/src/Ams.UI/MainWindow.FooterUi.cs ]; then
            git rm ams-shell/src/Ams.UI/MainWindow.FooterUi.cs
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet && git diff --quiet; then
            echo 'CI-66 sources are already restored'
            exit 0
          fi
          git add -A
          git commit -m 'restore: CI-66 layout and key down/up actions'
          git push
