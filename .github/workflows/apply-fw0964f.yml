name: Apply accepted firmware 0.9.64f
on:
  push:
    branches: [fix/exported-firmware-0964f]
permissions:
  contents: write
jobs:
  apply-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - name: Reconstruct exact sources
        shell: pwsh
        run: |
          $b64=((Get-ChildItem .github/fwparts/part*|Sort-Object Name|ForEach-Object {Get-Content $_.FullName -Raw})-join '')
          [IO.File]::WriteAllBytes('fw.tgz',[Convert]::FromBase64String($b64))
          tar -xzf fw.tgz
          Remove-Item fw.tgz
          python tools/make_fw_template_0.9.64f.py .
          python tools/prepare_release_patch_0965.py
          python -m py_compile firmware/code64f/code.py firmware/code64f/plan_engine.py
          if((Get-FileHash firmware/code64f/code.py -Algorithm SHA256).Hash.ToLower() -ne '1d1afe089f938968f71e1f67ea4ea6495c072756d3214b7c24e1830a269a565a'){throw 'code hash mismatch'}
          if((Get-FileHash firmware/arm25/ams_board25.ino -Algorithm SHA256).Hash.ToLower() -ne '4b54d04b328ea7a375daa82786fab733d9ae2055a21f6f72cc1a42164266c16c'){throw 'arm hash mismatch'}
          if(Test-Path firmware/arm25/ams_key.h){throw 'secret header present'}
      - name: Full TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
          dotnet run --project tests/TestRunner.csproj -c Release
      - name: Commit tested tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .github/fwparts
          Remove-Item .github/workflows/apply-fw0964f.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(firmware): port hardware-accepted Pico 0.9.64f and arm 2.5'
          git push
