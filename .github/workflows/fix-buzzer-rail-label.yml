name: fix buzzer rail label
on:
  push:
    branches: [feat/custom-gp6-buzzer]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-gp6-buzzer
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ams-shell/src/Ams.UI/MainWindow.xaml')
          s=p.read_text(encoding='utf-8')
          old='<TextBlock Text="Audio" FontSize="8"'
          new='<TextBlock Text="Buzzer" FontSize="8"'
          if s.count(old)!=1: raise SystemExit('rail label not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          Path('.github/workflows/fix-buzzer-rail-label.yml').unlink()
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: label GP6 buzzer rail action"
          git push
