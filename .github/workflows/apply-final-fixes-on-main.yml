name: Apply final fixes and build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply the checked-in final patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          wf = Path('.github/workflows/final-fixes-build.yml').read_text(encoding='utf-8')
          begin = '          python - <<\'PY\'\n'
          end = '\n          PY\n'
          if begin not in wf or end not in wf:
              raise SystemExit('embedded patch block not found')
          body = wf.split(begin, 1)[1].split(end, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('tools/_apply_final_fixes.py').write_text(body, encoding='utf-8')
          subprocess.run(['python', 'tools/_apply_final_fixes.py'], check=True)
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/src/Ams.UI firmware/autocycle-hostusb-v5/code.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply final buzzer and human mouse fixes"
            git push
          fi
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.x}
      - name: Build release
        run: dotnet build ams-shell/AMS.sln --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: Classroom-Studio-final-fixes
          path: ams-shell/src/Ams.UI/bin/Release/**
          if-no-files-found: warn
