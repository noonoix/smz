name: Regenerate embedded plan exporter

on:
  push:
    branches: [main]
    paths:
      - "project-state/plan-exporter-regeneration.trigger.txt"
      - ".github/workflows/regenerate-plan-exporter.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate embedded runtime from canonical source
        run: python3 tools/make_plan_exporter.py
      - name: Commit generated exporter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/src/Ams.UI/Services/PlanExporter.cs portable/plan3/CIRCUITPY-SPLIT
          if git diff --cached --quiet; then
            echo "Generated exporter is already current"
          else
            git commit -m "fix: regenerate embedded plan runtime from canonical source"
            git push
          fi
