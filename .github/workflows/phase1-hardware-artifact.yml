name: Phase 1 GP7 hardware artifact

on:
  pull_request:
    paths:
      - 'ams-shell/**'
      - 'firmware/code64f/**'
      - '.github/workflows/phase1-hardware-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gp7-bundle:
    name: phase1 / GP7 hardware artifact
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore application
        shell: pwsh
        run: dotnet restore ams-shell/AMS.sln

      - name: Build GP7 export harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phase1-hardware-export, hardware-gate-gp7 | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../ams-shell/src/Ams.UI/Ams.UI.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content phase1-hardware-export/HardwareExport.csproj -Encoding utf8
          @'
          using System;
          using System.IO;
          using Ams.UI.Services;

          var dir = Path.GetFullPath("hardware-gate-gp7");
          Directory.CreateDirectory(dir);
          var states = Array.Empty<PicoFirmwareExporter.LightState>();
          File.WriteAllText(Path.Combine(dir, "code.py"), PicoFirmwareExporter.BuildCodePy(
              states, "phase1-gp7-hardware-gate", loopMode: "once", loopCount: 0, loopSeconds: 0,
              keyboardOnArm: false, runStopHotkey: "Shift+F1", pauseResumeHotkey: "Shift+F3", buzzerGpio: "GP7"));
          File.WriteAllText(Path.Combine(dir, "boot.py"), PicoFirmwareExporter.BuildBootPy());
          File.WriteAllText(Path.Combine(dir, "pico-calibration.json"), PicoFirmwareExporter.BuildCalibrationJson(states, "phase1-gp7-hardware-gate"));
          File.WriteAllText(Path.Combine(dir, "README-FLASH.md"), PicoFirmwareExporter.BuildReadme(
              states, "phase1-gp7-hardware-gate", loopMode: "once", loopCount: 0, loopSeconds: 0,
              keyboardOnArm: false, buzzerGpio: "GP7"));
          File.Copy("firmware/code64f/plan_engine.py", Path.Combine(dir, "plan_engine.py"), true);
          File.WriteAllText(Path.Combine(dir, "HARDWARE-GATE.md"), "# Phase 1 GP7 hardware gate\n\nSource: phase1/configurable-buzzer-gpio\nGenerated by CI from commit: " + Environment.GetEnvironmentVariable("GITHUB_SHA") + "\n\nUse only on the Pico for this Phase 1 test. The passive buzzer control is GP7 (physical Pico pin 10). Keep the existing transistor/resistor driver and common ground; do not connect the buzzer directly to the GPIO.\n\nBefore power: verify UART GP16/GP17, I2C GP20/GP21, keypad GP2-GP5 and common ground are unchanged.\n\nManual test only: boot, send BEEP|880,180, verify sound, run a minimal HID/UART smoke test, and keep automatic restart/resume disabled.\n");
          '@ | Set-Content phase1-hardware-export/Program.cs -Encoding utf8
          dotnet restore phase1-hardware-export/HardwareExport.csproj
          dotnet run --project phase1-hardware-export/HardwareExport.csproj -c Release --no-restore
          if (-not (Select-String -Path hardware-gate-gp7/code.py -Pattern 'PWMOut\(board\.GP7' -Quiet)) { throw 'Generated code.py does not contain PWMOut(board.GP7' }
          if (Select-String -Path hardware-gate-gp7/code.py -Pattern 'PWMOut\(board\.GP6' -Quiet) { throw 'Generated GP7 code still contains GP6 PWM output' }
          Get-FileHash hardware-gate-gp7/* | Format-Table -AutoSize | Out-File hardware-gate-gp7/sha256.txt

      - name: Upload GP7 hardware gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-gp7-hardware-gate-${{ github.sha }}
          path: hardware-gate-gp7
          if-no-files-found: error
          retention-days: 14
