name: Patch insertion count through repository API
on:
  push:
    branches: [feature/error-step-timeout-ui]
    paths:
      - .github/workflows/patch-count-api.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path = 'tests/TestRunner.cs';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: context.ref
            });
            const oldText = Buffer.from(file.content, 'base64').toString('utf8');
            const oldNeedle = 'Assert(v43insert.Count == 24,';
            const newNeedle = 'Assert(v43insert.Count == 25,';
            if (!oldText.includes(oldNeedle)) {
              core.setFailed('stale assertion not found');
              return;
            }
            const newText = oldText.replace(oldNeedle, newNeedle);
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Correct insertion-surface step-count assertion',
              content: Buffer.from(newText, 'utf8').toString('base64'),
              sha: file.sha,
              branch: context.ref.replace('refs/heads/', '')
            });
