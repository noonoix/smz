name: Phase 1 migration v7

on:
  push:
    branches: [phase1/configurable-buzzer-gpio]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add buzzer setting and clean migration helpers
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          def once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise RuntimeError(f'{label}: expected 1 match, found {n}')
              return text.replace(old,new,1)

          doc=root/'ams-shell/src/Ams.UI/Services/DocumentService.cs'
          s=doc.read_text(encoding='utf-8')
          s=once(s,'    // v0.9.67 — portable automatic-cycle settings. These belong to app settings and are\n    // intentionally not written into .amsj documents. The buzzer pin is hardware policy,\n    // not a user option: every portable export uses GP6.','    // v0.9.67 — portable automatic-cycle settings. These belong to app settings and are\n    // intentionally not written into .amsj documents. BuzzerGpio is persisted here as\n    // hardware policy and is consumed by both normal and AutoCycle exports.','AppSettings buzzer contract comment')
          s=once(s,'    public const string PortableBuzzerPin = "GP6";','    public static string PortableBuzzerPin => BuzzerGpioPolicy.NormalizeOrDefault(Load().BuzzerGpio);','portable buzzer pin')
          doc.write_text(s,encoding='utf-8')

          xaml=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml'
          s=xaml.read_text(encoding='utf-8')
          anchor='            </StackPanel>\n\n            <!-- Playback -->'
          block='''            <StackPanel x:Name="SerialPanel" />

            <!-- Playback -->'''
          # Replace only the closing boundary after the existing serial panel by inserting controls before it.
          controls='''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پین بازر Pico" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ComboBox x:Name="BuzzerGpioBox" Width="200" HorizontalContentAlignment="Right" />
                </StackPanel>
                <TextBlock Text="GP6 پیش‌فرض است؛ پین‌های GP3/GP4، GP16/GP17 و GP20/GP21 رزرو هستند." TextWrapping="Wrap" TextAlignment="Right" FontSize="11" Margin="0,2,0,0" Foreground="{StaticResource TextTertiaryBrush}" />
            </StackPanel>

            <!-- Playback -->'''
          if s.count(anchor)!=1: raise RuntimeError('serial/playback boundary not found')
          s=s.replace(anchor,controls,1)
          xaml.write_text(s,encoding='utf-8')

          cs=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml.cs'
          s=cs.read_text(encoding='utf-8')
          s=once(s,'    public string KeyboardBoard { get; private set; } = "pico";','    public string KeyboardBoard { get; private set; } = "pico";\n    public string BuzzerGpio { get; private set; } = "GP6";','buzzer dialog property')
          s=once(s,'        ToolkitBox.Text = toolkitDir;\n','        ToolkitBox.Text = toolkitDir;\n        var buzzerSettings = Ams.UI.Services.AppSettings.Load();\n        BuzzerGpioBox.ItemsSource = Ams.UI.Services.BuzzerGpioPolicy.AllowedPins;\n        BuzzerGpio = Ams.UI.Services.BuzzerGpioPolicy.NormalizeOrDefault(buzzerSettings.BuzzerGpio);\n        BuzzerGpioBox.SelectedItem = BuzzerGpio;\n','buzzer dialog initialization')
          save='''        var selectedBuzzer = BuzzerGpioBox.SelectedItem as string;
        if (!Ams.UI.Services.BuzzerGpioPolicy.TryValidate(selectedBuzzer, out var buzzerPin, out var buzzerError))
        {
            MessageBox.Show(buzzerError, "Buzzer GPIO", MessageBoxButton.OK, MessageBoxImage.Warning);
            return;
        }
        var savedBuzzerSettings = Ams.UI.Services.AppSettings.Load();
        savedBuzzerSettings.BuzzerGpio = buzzerPin;
        savedBuzzerSettings.Save();
        BuzzerGpio = buzzerPin;

        Finish(true);
'''
          s=once(s,'        Finish(true);\n',save,'buzzer dialog save')
          cs.write_text(s,encoding='utf-8')

          for p in root.glob('phase1-*-debug.txt'):
              p.unlink()
          for name in ['phase1-trigger.txt','phase1-trigger-2.txt']:
              p=root/name
              if p.exists(): p.unlink()
          for name in ['apply-phase1-buzzer.yml','phase1-migration-v2.yml','phase1-migration-v3.yml','phase1-migration-v4.yml','phase1-migration-v5.yml','phase1-migration-v6.yml']:
              p=root/'.github/workflows'/name
              if p.exists(): p.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ams-shell .github/workflows
          git commit -m "feat: expose configurable buzzer GPIO in settings"
          git push origin HEAD:phase1/configurable-buzzer-gpio
