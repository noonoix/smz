name: mouse reliability one-shot

on:
  push:
    branches: [phase1/configurable-buzzer-gpio]
    paths:
      - tools/apply_mouse_reliability.py
      - .github/workflows/mouse-reliability-one-shot.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/configurable-buzzer-gpio
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply, build, test, and publish result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'mouse-patch-result.txt'
          "mouse reliability run $(Get-Date -Format o)" | Set-Content $log

          python tools/apply_mouse_reliability.py 2>&1 | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            python -m py_compile ams-shell/bridge/bridge.py 2>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            dotnet build ams-shell/AMS.sln -c Release 2>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            dotnet run --project tests/TestRunner.csproj -c Release 2>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($code -eq 0) {
            Remove-Item tools/apply_mouse_reliability.py
            Remove-Item .github/workflows/mouse-reliability-one-shot.yml
            Remove-Item $log
            git add -A
            git commit -m "Fix mouse stop completion and host event flood"
            git push origin HEAD:phase1/configurable-buzzer-gpio
            exit 0
          }

          "FAILED exit=$code" | Add-Content $log
          git add $log
          git commit -m "Record mouse patch failure diagnostics"
          git push origin HEAD:phase1/configurable-buzzer-gpio
          exit $code
