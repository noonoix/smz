name: Light state downloadable test build

on:
  workflow_dispatch:
  push:
    branches: [feature/light-state-profiles]

permissions:
  contents: write

jobs:
  windows-test-package:
    name: light-state / build-test-package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bridge
        shell: pwsh
        run: |
          python -m py_compile ams-shell/bridge/bridge.py ams-shell/bridge/ams_serial.py ams-shell/bridge/ams_crypto.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_bridge_pico.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and build Classroom Studio
        shell: pwsh
        run: |
          dotnet restore ams-shell/AMS.sln 2>&1 | Tee-Object test-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object test-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object test-runner.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object -Append test-runner.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path test-runner.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Run light telemetry and profile contracts
        shell: pwsh
        run: |
          dotnet run --project tests/LightTelemetryTests/LightTelemetryTests.csproj -c Release 2>&1 | Tee-Object light-profile-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path light-profile-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Package test build
        shell: pwsh
        run: |
          $out = 'ams-shell/src/Ams.UI/bin/Release/net8.0-windows'
          Remove-Item -Recurse -Force "$out/bridge/__pycache__" -ErrorAction SilentlyContinue
          @(
            'Classroom Studio — Light State Profiles test build',
            'Source branch: feature/light-state-profiles',
            'Source commit: ${{ github.sha }}',
            'Purpose: Windows visual QA and BH1750 profile calibration.',
            'This is a diagnostic test build. Launch/Auto Resume light gating remains disabled.',
            'Login and DC share one light profile; DC recovery prepends exactly one ESC.',
            '',
            'Start with TEST-GUIDE-FA.md in the release assets.'
          ) | Set-Content "$out/LIGHT-STATE-TEST.txt" -Encoding utf8
          Compress-Archive -Path "$out/*" -DestinationPath 'Classroom-Studio-light-state-test.zip' -Force
          (Get-FileHash 'Classroom-Studio-light-state-test.zip' -Algorithm SHA256).Hash | Out-File 'light-state-test-sha256.txt' -Encoding ascii
          $mainResult = (Select-String -Path test-runner.log -Pattern '=== Results' | Select-Object -Last 1).Line
          $lightResult = (Select-String -Path light-profile-tests.log -Pattern 'results:' | Select-Object -Last 1).Line
          @(
            '# Light State Profiles — test build',
            '',
            "Source commit: `${{ github.sha }}`",
            '',
            "Main tests: $mainResult",
            '',
            "Light tests: $lightResult",
            '',
            "SHA-256: `$(Get-Content light-state-test-sha256.txt -Raw)`",
            '',
            'Diagnostic build only; runtime light gates remain disabled.'
          ) | Set-Content release-body.md -Encoding utf8
          @(
            '# راهنمای تست مرحله اول',
            '',
            '1. فایل ZIP را Extract کنید؛ برنامه را از داخل ZIP اجرا نکنید.',
            '2. ClassroomStudio.exe را اجرا کنید.',
            '3. وارد تب «وضعیت» شوید.',
            '4. فعلاً برد را وصل نکنید؛ ابتدا ظاهر RTL و نمایش شش پروفایل را بررسی کنید.',
            '5. نتیجه مرحله اول را گزارش کنید؛ سپس تست اتصال و Live Watch را ادامه می‌دهیم.',
            '',
            'این نسخه آزمایشی است و گیت اجرایی Launch/Auto Resume خاموش می‌ماند.'
          ) | Set-Content TEST-GUIDE-FA.md -Encoding utf8

      - name: Publish prerelease test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: light-state-test-${{ github.run_number }}
          name: "Light State Profiles test #${{ github.run_number }}"
          prerelease: true
          body_path: release-body.md
          files: |
            Classroom-Studio-light-state-test.zip
            light-state-test-sha256.txt
            TEST-GUIDE-FA.md
            test-runner.log
            light-profile-tests.log
