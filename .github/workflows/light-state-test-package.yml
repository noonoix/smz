name: Light state downloadable test build

on:
  workflow_dispatch:
  push:
    branches: [feature/light-state-profiles]

permissions:
  contents: write

jobs:
  windows-test-package:
    name: light-state / build-test-package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical LUX migration once
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          bridge = Path('ams-shell/bridge/bridge.py')
          text = bridge.read_text(encoding='utf-8')
          old = '        want = "PONG" if expect == "PING" else expect\n        retried = False                  # v0.9.60g - one retry on ERR|UNKNOWN (UART glitch)'
          new = '        # LUX? drops the question mark in OK/error response subjects.\n        want = "PONG" if expect == "PING" else ("LUX" if expect == "LUX?" else expect)\n        error_subject = "LUX" if expect == "LUX?" else expect\n        retried = False                  # v0.9.60g - one retry on ERR|UNKNOWN (UART glitch)'
          if old not in text:
              raise SystemExit('success correlation anchor not found')
          text = text.replace(old, new, 1)
          old = '            if len(parts) >= 3 and parts[0] == "ERR" and parts[2] and parts[2] != expect:\n                continue                 # v0.9.60e - stale ERR of an older command'
          new = '            if len(parts) >= 3 and parts[0] == "ERR" and parts[2] and parts[2] != error_subject:\n                continue                 # v0.9.60e - stale ERR of an older command'
          if old not in text:
              raise SystemExit('error correlation anchor not found')
          bridge.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tools/test_bridge_pico.py')
          text = tests.read_text(encoding='utf-8')
          old = ' 8. HALT goes out as a bare write (abort path), close() sends HALT+BYE\n"""'
          new = ' 8. HALT goes out as a bare write (abort path), close() sends HALT+BYE\n 9. LUX? correlates OK|LUX and ERR|...|LUX while preserving EVT lines\n"""'
          if old not in text:
              raise SystemExit('test doc anchor not found')
          text = text.replace(old, new, 1)
          anchor = 'print("=== bridge pico transport: %d checks passed, 0 failed ===" % PASSED)\n'
          addition = '''# ── scenario 9: canonical LUX? response/error correlation ─────────────
pico5 = FakePort([
    ("PING", [BRAIN_PONG]),
    ("LUX?", ["EVT|HOSTUSB|UP", "OK|LUX|seq=42|lux=1284.7|mode=hires|sensor=ok"]),
])
br5 = fresh_bridge(pico5)
link5, _ = br5.open_link("COM5")
reply = link5.command("LUX?", timeout=1.0)
check("9a: LUX? accepts canonical OK|LUX", reply == "OK|LUX|seq=42|lux=1284.7|mode=hires|sensor=ok")
check("9b: LUX? preserves interleaved EVT", link5.events == ["EVT|HOSTUSB|UP"])

pico6 = FakePort([("PING", [BRAIN_PONG]), ("LUX?", ["ERR|NOSENSOR|LUX"])])
br6 = fresh_bridge(pico6)
link6, _ = br6.open_link("COM5")
reply = link6.command("LUX?", timeout=1.0)
check("9c: LUX? accepts canonical typed Lux error", reply == "ERR|NOSENSOR|LUX")

print("=== bridge pico transport: %d checks passed, 0 failed ===" % PASSED)
'''
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          tests.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          state = Path('project-state/PROJECT-STATE.md')
          text = state.read_text(encoding='utf-8')
          start = text.index('## پروفایل‌های اولیه فاز ۴')
          end = text.index('\n## قرارداد Login و DC', start)
          calibrated = '''## پروفایل‌های کالیبره‌شده فاز ۴

کالیبراسیون نهایی در ۲۰۲۶-۰۹-۱۵ روی سخت‌افزار واقعی تأیید شد. هر شش پروفایل فعال‌اند، `StableDuration = 1250 ms` و `Hysteresis = 1 Lux` است:

- Desktop: مرکز `35.8`، تلورانس `±1`، بازه‌ی `34.8..36.8`.
- Login یا DC: مرکز `5.8`، تلورانس `±2.6`، بازه‌ی `3.2..8.4`.
- Character dashboard: مرکز `15.8`، تلورانس `±1`، بازه‌ی `14.8..16.8`.
- Entering-game loading: مرکز `38.3`، تلورانس `±0.5`، بازه‌ی `37.8..38.8`.
- Game: مرکز `26.7`، تلورانس `±1`، بازه‌ی `25.7..27.7`.
- Targeted: مرکز `30`، تلورانس `±1`، بازه‌ی `29..31`.

بازه‌های مؤثر overlap ندارند و گذارهای واقعی بدون Ambiguous پایدار تأیید شده‌اند.
'''
          state.write_text(text[:start] + calibrated + text[end:], encoding='utf-8')
          '@ | Set-Content apply_canonical_lux.py -Encoding utf8
          python apply_canonical_lux.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile ams-shell/bridge/bridge.py tools/test_bridge_pico.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_bridge_pico.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git show HEAD^:.github/workflows/light-state-test-package.yml | Set-Content .github/workflows/light-state-test-package.yml -Encoding utf8
          Remove-Item .github/workflows/apply-light-state-canonical.yml -ErrorAction SilentlyContinue
          Remove-Item apply_canonical_lux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/bridge/bridge.py tools/test_bridge_pico.py project-state/PROJECT-STATE.md .github/workflows/light-state-test-package.yml .github/workflows/apply-light-state-canonical.yml
          git commit -m "Fix canonical LUX response correlation"
          git push origin HEAD:feature/light-state-profiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate bridge
        shell: pwsh
        run: |
          python -m py_compile ams-shell/bridge/bridge.py ams-shell/bridge/ams_serial.py ams-shell/bridge/ams_crypto.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_bridge_pico.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and build Classroom Studio
        shell: pwsh
        run: |
          dotnet restore ams-shell/AMS.sln 2>&1 | Tee-Object test-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object test-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object test-runner.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object -Append test-runner.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path test-runner.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Run light telemetry and profile contracts
        shell: pwsh
        run: |
          dotnet run --project tests/LightTelemetryTests/LightTelemetryTests.csproj -c Release 2>&1 | Tee-Object light-profile-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path light-profile-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Package test build
        shell: pwsh
        run: |
          $out = 'ams-shell/src/Ams.UI/bin/Release/net8.0-windows'
          Remove-Item -Recurse -Force "$out/bridge/__pycache__" -ErrorAction SilentlyContinue
          @(
            'Classroom Studio — Light State Profiles test build',
            'Source branch: feature/light-state-profiles',
            'Source commit: ${{ github.sha }}',
            'Purpose: Windows visual QA and BH1750 profile calibration.',
            'This is a diagnostic test build. Launch/Auto Resume light gating remains disabled.',
            'Login and DC share one light profile; DC recovery prepends exactly one ESC.',
            '',
            'Start with TEST-GUIDE-FA.md in the release assets.'
          ) | Set-Content "$out/LIGHT-STATE-TEST.txt" -Encoding utf8
          Compress-Archive -Path "$out/*" -DestinationPath 'Classroom-Studio-light-state-test.zip' -Force
          (Get-FileHash 'Classroom-Studio-light-state-test.zip' -Algorithm SHA256).Hash | Out-File 'light-state-test-sha256.txt' -Encoding ascii
          $mainResult = (Select-String -Path test-runner.log -Pattern '=== Results' | Select-Object -Last 1).Line
          $lightResult = (Select-String -Path light-profile-tests.log -Pattern 'results:' | Select-Object -Last 1).Line
          @(
            '# Light State Profiles — test build',
            '',
            "Source commit: `${{ github.sha }}`",
            '',
            "Main tests: $mainResult",
            '',
            "Light tests: $lightResult",
            '',
            "SHA-256: `$(Get-Content light-state-test-sha256.txt -Raw)`",
            '',
            'Diagnostic build only; runtime light gates remain disabled.'
          ) | Set-Content release-body.md -Encoding utf8
          @(
            '# راهنمای تست مرحله اول',
            '',
            '1. فایل ZIP را Extract کنید؛ برنامه را از داخل ZIP اجرا نکنید.',
            '2. ClassroomStudio.exe را اجرا کنید.',
            '3. وارد تب «وضعیت» شوید.',
            '4. فعلاً برد را وصل نکنید؛ ابتدا ظاهر RTL و نمایش شش پروفایل را بررسی کنید.',
            '5. نتیجه مرحله اول را گزارش کنید؛ سپس تست اتصال و Live Watch را ادامه می‌دهیم.',
            '',
            'این نسخه آزمایشی است و گیت اجرایی Launch/Auto Resume خاموش می‌ماند.'
          ) | Set-Content TEST-GUIDE-FA.md -Encoding utf8

      - name: Publish prerelease test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: light-state-test-${{ github.run_number }}
          name: "Light State Profiles test #${{ github.run_number }}"
          prerelease: true
          body_path: release-body.md
          files: |
            Classroom-Studio-light-state-test.zip
            light-state-test-sha256.txt
            TEST-GUIDE-FA.md
            test-runner.log
            light-profile-tests.log
