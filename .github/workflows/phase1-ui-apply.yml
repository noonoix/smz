name: Phase 1 UI apply

on:
  push:
    branches: [phase1/configurable-buzzer-gpio]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI and persistence changes
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          log=[]
          def note(s): print(s); log.append(s)
          def once(text,old,new,label):
              n=text.count(old); note(f'{label}: {n}')
              if n!=1: raise RuntimeError(f'{label}: expected one match, got {n}')
              return text.replace(old,new,1)
          try:
              doc=root/'ams-shell/src/Ams.UI/Services/DocumentService.cs'
              s=doc.read_text(encoding='utf-8')
              old='    // v0.9.67 — portable automatic-cycle settings. These belong to app settings and are\n    // intentionally not written into .amsj documents. The buzzer pin is hardware policy,\n    // not a user option: every portable export uses GP6.'
              new='    // v0.9.67 — portable automatic-cycle settings. These belong to app settings and are\n    // intentionally not written into .amsj documents. BuzzerGpio is persisted here as\n    // hardware policy and is consumed by both normal and AutoCycle exports.'
              s=once(s,old,new,'settings comment')
              s=once(s,'    public const string PortableBuzzerPin = "GP6";','    public static string PortableBuzzerPin => BuzzerGpioPolicy.NormalizeOrDefault(Load().BuzzerGpio);','portable pin property')
              doc.write_text(s,encoding='utf-8')

              xaml=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml'
              s=xaml.read_text(encoding='utf-8')
              boundary='            </StackPanel>\n\n            <!-- Playback -->'
              controls='''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پین بازر Pico" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ComboBox x:Name="BuzzerGpioBox" Width="200" HorizontalContentAlignment="Right" />
                </StackPanel>
                <TextBlock Text="GP6 پیش‌فرض است؛ پین‌های GP3/GP4، GP16/GP17 و GP20/GP21 رزرو هستند." TextWrapping="Wrap" TextAlignment="Right" FontSize="11" Margin="0,2,0,0" Foreground="{StaticResource TextTertiaryBrush}" />
            </StackPanel>

            <!-- Playback -->'''
              s=once(s,boundary,controls,'settings XAML boundary')
              xaml.write_text(s,encoding='utf-8')

              cs=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml.cs'
              s=cs.read_text(encoding='utf-8')
              s=once(s,'    public string KeyboardBoard { get; private set; } = "pico";','    public string KeyboardBoard { get; private set; } = "pico";\n    public string BuzzerGpio { get; private set; } = "GP6";','dialog property')
              s=once(s,'        ToolkitBox.Text = toolkitDir;\n','        ToolkitBox.Text = toolkitDir;\n        var buzzerSettings = Ams.UI.Services.AppSettings.Load();\n        BuzzerGpioBox.ItemsSource = Ams.UI.Services.BuzzerGpioPolicy.AllowedPins;\n        BuzzerGpio = Ams.UI.Services.BuzzerGpioPolicy.NormalizeOrDefault(buzzerSettings.BuzzerGpio);\n        BuzzerGpioBox.SelectedItem = BuzzerGpio;\n','dialog initialization')
              save='''        var selectedBuzzer = BuzzerGpioBox.SelectedItem as string;
        if (!Ams.UI.Services.BuzzerGpioPolicy.TryValidate(selectedBuzzer, out var buzzerPin, out var buzzerError))
        {
            MessageBox.Show(buzzerError, "Buzzer GPIO", MessageBoxButton.OK, MessageBoxImage.Warning);
            return;
        }
        var savedBuzzerSettings = Ams.UI.Services.AppSettings.Load();
        savedBuzzerSettings.BuzzerGpio = buzzerPin;
        savedBuzzerSettings.Save();
        BuzzerGpio = buzzerPin;

        Finish(true);
'''
              s=once(s,'        Finish(true);\n',save,'dialog save')
              cs.write_text(s,encoding='utf-8')
              note('SUCCESS')
              Path('phase1-ui-debug.txt').write_text('\n'.join(log)+'\n',encoding='utf-8')
              (root/'.github/workflows/phase1-ui-apply.yml').unlink()
              raise SystemExit(0)
          except Exception as e:
              note('ERROR '+repr(e))
              Path('phase1-ui-debug.txt').write_text('\n'.join(log)+'\n',encoding='utf-8')
              raise
          PY
          rc=$?
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if [ "$rc" -eq 0 ]; then git commit -m "feat: add configurable buzzer GPIO settings"; else git commit -m "ci: record phase one UI diagnostics" || true; fi
          git push origin HEAD:phase1/configurable-buzzer-gpio || true
          exit $rc
