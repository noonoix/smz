name: Restore CI-66 script generator

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore compatible script generator
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git checkout 6feff5f5242a1d2ee996eee0f43e3096c5fdcb6d -- ams-shell/src/Ams.UI/Services/ScriptGenerator.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ams-shell/src/Ams.UI/Services/ScriptGenerator.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'restore: CI-66 script generator compatibility'
          git push
