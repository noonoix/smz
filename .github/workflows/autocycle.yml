name: AutoCycle integration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ams-shell/**'
      - 'firmware/arm26/**'
      - 'firmware/autocycle-hostusb-v5/**'
      - 'portable/plan3/**'
      - '.github/workflows/autocycle.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  portable-contracts:
    name: autocycle / portable contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run every portable contract
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m py_compile portable/plan3/CIRCUITPY/*.py
            python -m py_compile portable/plan3/CIRCUITPY-SPLIT/*.py
            python -m py_compile portable/plan3/tools/*.py portable/plan3/sim/*.py
            count=0
            for test in portable/plan3/sim/test_*.py; do
              echo "=== $test ==="
              python "$test"
              count=$((count + 1))
            done
            test "$count" -gt 0
            echo "AutoCycle contract files passed: $count"
          } 2>&1 | tee autocycle-portable.log
      - name: Report portable failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('autocycle-portable.log') ? fs.readFileSync('autocycle-portable.log','utf8') : '(no log)';
            const tail = log.split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-portable-failure -->\n**AutoCycle portable failure tail**\n```\n'+tail+'\n```'});

  windows-app:
    name: autocycle / Windows app build-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply RunEngine keyboard guard
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $p = 'ams-shell/src/Ams.UI/Services/RunEngine.cs'
          $current = Get-Content $p -Raw
          if ($current.Trim() -eq 'PLACEHOLDER') {
            git show a6b709d0b86ad666753732f31bdbcca441ed9820:$p | Set-Content $p -Encoding UTF8
          }
          $s = Get-Content $p -Raw
          if ($s -notmatch '_heldKeyboardKeys') {
            $s = $s.Replace('private readonly HashSet<string> _scriptStack = new(StringComparer.OrdinalIgnoreCase);', 'private readonly HashSet<string> _scriptStack = new(StringComparer.OrdinalIgnoreCase);' + "`r`n" + '    // v0.9.64-keyboard-test — suppress duplicate explicit KDOWN for a key already held in this run.' + "`r`n" + '    private readonly HashSet<string> _heldKeyboardKeys = new(StringComparer.Ordinal);')
            $s = $s.Replace('_parallelKeySeq = 0; _lastParallelKeyTick = 0; _mouseRestAtSeq = -1;   // v0.9.23 — reset typing signal', '_parallelKeySeq = 0; _lastParallelKeyTick = 0; _mouseRestAtSeq = -1;   // v0.9.23 — reset typing signal' + "`r`n" + '        _heldKeyboardKeys.Clear();')
            $old = 'await Send(wireCmd, ct,' + "`r`n" + '                                logAs: secret && cmd.StartsWith("KTEXT|") ? MaskKtext(cmd) : null);'
            $new = 'if (TryHandleKeyboardStateGuard(wireCmd, out var guardedCmd, out var guardLog))' + "`r`n" + '                            {' + "`r`n" + '                                if (guardLog is not null) _log(guardLog);' + "`r`n" + '                                if (guardedCmd is not null)' + "`r`n" + '                                    await Send(guardedCmd, ct, logAs: secret && cmd.StartsWith("KTEXT|") ? MaskKtext(cmd) : null);' + "`r`n" + '                            }' + "`r`n" + '                            else' + "`r`n" + '                            {' + "`r`n" + '                                await Send(wireCmd, ct,' + "`r`n" + '                                    logAs: secret && cmd.StartsWith("KTEXT|") ? MaskKtext(cmd) : null);' + "`r`n" + '                            }'
            $s = $s.Replace($old, $new)
            $helper = @'

    private bool TryHandleKeyboardStateGuard(string cmd, out string? guardedCmd, out string? guardLog)
    {
        guardedCmd = cmd;
        guardLog = null;
        string body = cmd;
        string route = "direct";
        if (body.StartsWith("KBDARM|", StringComparison.Ordinal)) { route = "arm"; body = body[7..]; }
        else if (body.StartsWith("KBDPICO|", StringComparison.Ordinal)) { route = "pico"; body = body[8..]; }
        if (body.StartsWith("KDOWN|", StringComparison.Ordinal) && int.TryParse(body[6..], out var downVk))
        {
            string key = route + ":" + downVk;
            if (!_heldKeyboardKeys.Add(key))
            {
                guardedCmd = null;
                guardLog = $"keyboard guard: duplicate {body} suppressed ({route})";
                return true;
            }
            return true;
        }
        if (body.StartsWith("KUP|", StringComparison.Ordinal) && int.TryParse(body[4..], out var upVk))
        {
            _heldKeyboardKeys.Remove(route + ":" + upVk);
            return true;
        }
        return false;
    }
'@
            $s = $s.Replace("`r`n    private async Task<string> Send(string cmd", $helper + "`r`n    private async Task<string> Send(string cmd")
            Set-Content $p $s -Encoding UTF8
          }
          if ((git status --porcelain $p)) {
            git add $p
            git commit -m "Fix duplicate held keyboard key downs"
            git push origin HEAD:phase1/configurable-buzzer-gpio
          }
      - name: Restore
        shell: pwsh
        run: dotnet restore ams-shell/AMS.sln 2>&1 | Tee-Object windows-restore.log
      - name: Build Classroom Studio
        shell: pwsh
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object windows-build.log
      - name: Build TestRunner from a clean tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object windows-testrunner-build.log
      - name: Run TestRunner and reject any failure
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path windows-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Report Windows failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const names=['windows-restore.log','windows-build.log','windows-testrunner-build.log','windows-tests.log'];
            const text=names.map(n=>fs.existsSync(n)?('=== '+n+' ===\n'+fs.readFileSync(n,'utf8')):'').join('\n');
            const lines=text.split('\n');
            const failures=lines.filter(line=>line.includes('FAIL:')||line.includes('Unhandled exception')||line.includes('Results:')).join('\n');
            const tail=lines.slice(-100).join('\n');
            const report=(failures?'=== failure markers ===\n'+failures+'\n':'')+'=== tail ===\n'+tail;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-windows-failure -->\n**AutoCycle Windows failure diagnostics**\n```\n'+report+'\n```'});
