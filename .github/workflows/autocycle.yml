name: AutoCycle integration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ams-shell/**'
      - 'firmware/arm26/**'
      - 'firmware/autocycle-hostusb-v5/**'
      - 'portable/plan3/**'
      - '.github/workflows/autocycle.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  portable-contracts:
    name: autocycle / portable contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run every portable contract
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m py_compile portable/plan3/CIRCUITPY/*.py
            python -m py_compile portable/plan3/CIRCUITPY-SPLIT/*.py
            python -m py_compile portable/plan3/tools/*.py portable/plan3/sim/*.py
            count=0
            for test in portable/plan3/sim/test_*.py; do
              echo "=== $test ==="
              python "$test"
              count=$((count + 1))
            done
            test "$count" -gt 0
            echo "AutoCycle contract files passed: $count"
          } 2>&1 | tee autocycle-portable.log
      - name: Report portable failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('autocycle-portable.log') ? fs.readFileSync('autocycle-portable.log','utf8') : '(no log)';
            const tail = log.split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-portable-failure -->\n**AutoCycle portable failure tail**\n```\n'+tail+'\n```'});

  windows-app:
    name: autocycle / Windows app build-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore ams-shell/AMS.sln 2>&1 | Tee-Object windows-restore.log
      - name: Build Classroom Studio
        shell: pwsh
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object windows-build.log
      - name: Build TestRunner from a clean tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object windows-testrunner-build.log
      - name: Run TestRunner and reject any failure
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path windows-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Report Windows failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const names=['windows-restore.log','windows-build.log','windows-testrunner-build.log','windows-tests.log'];
            const text=names.map(n=>fs.existsSync(n)?('=== '+n+' ===\n'+fs.readFileSync(n,'utf8')):'').join('\n');
            const lines=text.split('\n');
            const failures=lines.filter(line=>line.includes('FAIL:')||line.includes('Unhandled exception')||line.includes('Results:')).join('\n');
            const tail=lines.slice(-100).join('\n');
            const report=(failures?'=== failure markers ===\n'+failures+'\n':'')+'=== tail ===\n'+tail;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-windows-failure -->\n**AutoCycle Windows failure diagnostics**\n```\n'+report+'\n```'});

  phase1-ui-migration:
    name: phase one / apply settings UI
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase1/configurable-buzzer-gpio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/configurable-buzzer-gpio
          fetch-depth: 0
      - name: Apply phase one settings UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          def once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return text.replace(old,new,1)

          doc=root/'ams-shell/src/Ams.UI/Services/DocumentService.cs'
          s=doc.read_text(encoding='utf-8')
          s=once(s,'    // v0.9.67 — portable automatic-cycle settings. These belong to app settings and are\n    // intentionally not written into .amsj documents. The buzzer pin is hardware policy,\n    // not a user option: every portable export uses GP6.','    // v0.9.67 — portable automatic-cycle settings. These belong to app settings and are\n    // intentionally not written into .amsj documents. BuzzerGpio is persisted here as\n    // hardware policy and is consumed by both normal and AutoCycle exports.','settings comment')
          s=once(s,'    public const string PortableBuzzerPin = "GP6";','    public static string PortableBuzzerPin => BuzzerGpioPolicy.NormalizeOrDefault(Load().BuzzerGpio);','portable pin')
          doc.write_text(s,encoding='utf-8')

          xaml=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml'
          s=xaml.read_text(encoding='utf-8')
          boundary='            </StackPanel>\n\n            <!-- Playback -->'
          controls='''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پین بازر Pico" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ComboBox x:Name="BuzzerGpioBox" Width="200" HorizontalContentAlignment="Right" />
                </StackPanel>
                <TextBlock Text="GP6 پیش‌فرض است؛ پین‌های GP3/GP4، GP16/GP17 و GP20/GP21 رزرو هستند." TextWrapping="Wrap" TextAlignment="Right" FontSize="11" Margin="0,2,0,0" Foreground="{StaticResource TextTertiaryBrush}" />
            </StackPanel>

            <!-- Playback -->'''
          s=once(s,boundary,controls,'settings XAML')
          xaml.write_text(s,encoding='utf-8')

          cs=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml.cs'
          s=cs.read_text(encoding='utf-8')
          s=once(s,'    public string KeyboardBoard { get; private set; } = "pico";','    public string KeyboardBoard { get; private set; } = "pico";\n    public string BuzzerGpio { get; private set; } = "GP6";','dialog property')
          s=once(s,'        ToolkitBox.Text = toolkitDir;\n','        ToolkitBox.Text = toolkitDir;\n        var buzzerSettings = Ams.UI.Services.AppSettings.Load();\n        BuzzerGpioBox.ItemsSource = Ams.UI.Services.BuzzerGpioPolicy.AllowedPins;\n        BuzzerGpio = Ams.UI.Services.BuzzerGpioPolicy.NormalizeOrDefault(buzzerSettings.BuzzerGpio);\n        BuzzerGpioBox.SelectedItem = BuzzerGpio;\n','dialog init')
          save='''        var selectedBuzzer = BuzzerGpioBox.SelectedItem as string;
        if (!Ams.UI.Services.BuzzerGpioPolicy.TryValidate(selectedBuzzer, out var buzzerPin, out var buzzerError))
        {
            MessageBox.Show(buzzerError, "Buzzer GPIO", MessageBoxButton.OK, MessageBoxImage.Warning);
            return;
        }
        var savedBuzzerSettings = Ams.UI.Services.AppSettings.Load();
        savedBuzzerSettings.BuzzerGpio = buzzerPin;
        savedBuzzerSettings.Save();
        BuzzerGpio = buzzerPin;

        Finish(true);
'''
          s=once(s,'        Finish(true);\n',save,'dialog save')
          cs.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/autocycle.yml > .github/workflows/autocycle.yml
          rm -f .github/workflows/phase1-ui-apply.yml .github/workflows/phase1-ui-apply-v9.yml phase1-ui-trigger.txt phase1-ui-v9-trigger.txt phase1-ui-v9-debug.txt
          git add ams-shell .github/workflows
          git commit -m "feat: add configurable buzzer GPIO settings"
          git push origin HEAD:phase1/configurable-buzzer-gpio
