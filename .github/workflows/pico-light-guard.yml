name: Pico combined light Guard firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/pico-light-guard-1.0.0/**'
      - 'portable/plan3/CIRCUITPY/**'
      - 'portable/plan3/sim/test_combined_guard_hid.py'
      - 'portable/plan3/sim/test_combined_guard_calibration_audio.py'
      - '.github/workflows/pico-light-guard.yml'

permissions:
  contents: read

jobs:
  validate-guard:
    name: pico-light-guard / validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile combined firmware sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            firmware/pico-light-guard-1.0.0/boot.py \
            firmware/pico-light-guard-1.0.0/code.py \
            firmware/pico-light-guard-1.0.0/combined_guard_runtime.py \
            firmware/pico-light-guard-1.0.0/guard_calibration_protocol.py \
            portable/plan3/CIRCUITPY/guard_calibration_protocol.py \
            portable/plan3/sim/test_combined_guard_hid.py \
            portable/plan3/sim/test_combined_guard_calibration_audio.py

      - name: Enforce combined Guard boundary
        shell: bash
        run: |
          set -euo pipefail
          root=firmware/pico-light-guard-1.0.0
          runtime="$root/combined_guard_runtime.py"
          entry="$root/code.py"
          grep -q 'usb_cdc.enable(console=True, data=True)' "$root/boot.py"
          grep -q 'usb_hid' "$root/boot.py"
          grep -q 'storage.remount("/", readonly=False)' "$root/boot.py"
          grep -q 'from combined_guard_runtime import main' "$entry"
          grep -q '_CAL_NOTES = (262, 294, 330, 349, 392, 440)' "$entry"
          grep -q 'runtime.Combined.start_cal = _audible_start_cal' "$entry"
          grep -q 'runtime.Combined.next_cal = _audible_next_cal' "$entry"
          grep -q 'runtime.Combined.cal_tick = _audible_cal_tick' "$entry"
          grep -q 'runtime.Combined.save_cal = _audible_save_cal' "$entry"
          grep -q 'from guard_calibration_protocol import build_calibration_get, parse_calibration_set' "$runtime"
          grep -q 'class Keyboard' "$runtime"
          grep -q 'self.keyboard.release_all()' "$runtime"
          ! grep -q 'from adafruit_hid' "$runtime"
          grep -q 'board.GP20' "$runtime"
          grep -q 'board.GP21' "$runtime"
          grep -q 'board.GP4' "$runtime"
          grep -q 'board.GP3' "$runtime"
          grep -q 'board.GP6' "$runtime"
          grep -q 'board.GP16' "$runtime"
          grep -q 'board.GP17' "$runtime"
          grep -q 'baudrate=57600' "$runtime"
          grep -q 'load_guard_bundle' "$runtime"
          grep -q 'GuardBundleError' "$runtime"
          grep -q 'plan_engine.run_plan' "$runtime"
          grep -q 'short UART write' "$runtime"
          grep -q 'self.pending >= 2' "$runtime"
          grep -q 'self.arm.abort' "$runtime"
          grep -q 'self.controls.paused' "$runtime"
          grep -q 'self.stage = 0' "$runtime"
          grep -q 'seconds=5' "$runtime"
          grep -q 'PROFILEs' "$runtime" || grep -q 'PROFILES' "$runtime"
          grep -q 'CALGET' "$runtime"
          grep -q 'CALSET' "$runtime"
          grep -q 'HASHED_BUNDLE_FILES' "$runtime"
          grep -q 'def _hash_manifest' "$runtime"
          grep -q 'def _write_verified_text' "$runtime"
          grep -q 'write verification mismatch' "$runtime"
          grep -q 'ERR|CAL|SAVE|' "$runtime"
          grep -q 'self._replace_text("/SHA256SUMS.txt", self._hash_manifest())' "$runtime"
          grep -q 'old_hashes = self._read_text("/SHA256SUMS.txt")' "$runtime"
          grep -q '("/SHA256SUMS.txt", old_hashes)' "$runtime"
          grep -q 'NOT a complete CIRCUITPY runtime bundle' "$root/SAFE-MANIFEST.txt"
          ! grep -Eq 'usb_hid\.disable|role=light-guard.*hid=off|RunEngine' "$runtime"

      - name: Test combined Guard calibration and HID contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 portable/plan3/sim/test_combined_guard_calibration_protocol.py
          python3 portable/plan3/sim/test_combined_guard_calibration_audio.py
          python3 portable/plan3/sim/test_combined_guard_hid.py

      - name: Package combined Guard core source artifact
        shell: bash
        run: |
          set -euo pipefail
          root=firmware/pico-light-guard-1.0.0
          package=pico-light-guard-1.0.0-core
          find "$root" -type d -name '__pycache__' -prune -exec rm -rf {} +
          printf '%s\n' \
            'This is a core-source validation artifact, not a complete CIRCUITPY runtime bundle.' \
            'Do not copy it directly to CIRCUITPY.' \
            'Generate the complete seven-route bundle with Classroom Studio PortableGuardBundle.Export.' \
            'The complete bundle must include plan.txt, plan_engine.py, live_light_guard.py,' \
            'guard_transition.py, error_policy.py, seven route files, both JSON manifests and SHA256SUMS.txt.' \
            > "$package-SCOPE.txt"
          zip -qr "$package.zip" "$root" "$package-SCOPE.txt"
          sha256sum "$package.zip" | awk '{print toupper($1)}' > "$package-sha256.txt"
          cat "$package-sha256.txt"

      - name: Upload combined Guard core artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-light-guard-1.0.0-core
          path: |
            pico-light-guard-1.0.0-core.zip
            pico-light-guard-1.0.0-core-sha256.txt
            pico-light-guard-1.0.0-core-SCOPE.txt
          retention-days: 14
          if-no-files-found: error
