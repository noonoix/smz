name: Diagnose remaining firmware test mismatch
on:
  push:
    branches: [fix/exported-firmware-0964f]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - name: Reconstruct and capture failures
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force project-state | Out-Null
          $b64=((Get-ChildItem .github/fwparts/part*|Sort-Object Name|ForEach-Object {Get-Content $_.FullName -Raw})-join '')
          [IO.File]::WriteAllBytes('fw.tgz',[Convert]::FromBase64String($b64)); tar -xzf fw.tgz
          python tools/make_fw_template_0.9.64f.py .
          python tools/prepare_release_patch_0965.py
          python -c "from pathlib import Path; p=Path('tests/TestRunner.cs'); s=p.read_text(encoding='utf-8'); s=s.replace('0.9.64b','0.9.64f').replace('busio.UART(board.GP16, board.GP17, baudrate=115200, timeout=0.2)','busio.UART(board.GP16, board.GP17, baudrate=ARM_BAUD, timeout=0.2)'); p.write_text(s,encoding='utf-8',newline='')"
          Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
          dotnet run --project tests/TestRunner.csproj -c Release 2>&1 | Tee-Object project-state/fw0964f-full-test.txt
          Select-String -Path project-state/fw0964f-full-test.txt -Pattern '^FAIL:|^=== Results:' | ForEach-Object {$_.Line} | Set-Content project-state/fw0964f-failures.txt
      - name: Commit failure report
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-state/fw0964f-failures.txt
          git commit -m 'ci: record remaining firmware test mismatch'
          git push
