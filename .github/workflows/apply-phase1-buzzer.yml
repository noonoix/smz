name: Apply phase 1 configurable buzzer GPIO

on:
  push:
    branches: [phase1/configurable-buzzer-gpio]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply phase 1 source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          # Persisted application setting. This deliberately discovers the existing
          # AppSettings source so the migration remains independent of its file split.
          app_files = [p for p in (root / 'ams-shell/src/Ams.UI').rglob('*.cs')
                       if 'class AppSettings' in p.read_text(encoding='utf-8')]
          if len(app_files) != 1:
              raise RuntimeError('expected exactly one AppSettings source, found ' + str(app_files))
          app_path = app_files[0]
          app = app_path.read_text(encoding='utf-8')
          if 'BuzzerGpio' not in app:
              at = app.index('class AppSettings')
              brace = app.index('{', at)
              app = app[:brace + 1] + '\n    // Phase 1: absent legacy field means the backward-compatible Pico GP6.\n    public string BuzzerGpio { get; set; } = "GP6";\n' + app[brace + 1:]
              write(app_path, app)

          policy = '''using System.Collections.ObjectModel;

          namespace Ams.UI.Services;

          /// <summary>Phase 1 buzzer pin contract. Only free PWM-capable Pico pins are exposed.</summary>
          public static class BuzzerGpioPolicy
          {
              // GP3/GP4 are physical controls, GP16/GP17 are the arm UART and GP20/GP21 are BH1750 I2C.
              private static readonly string[] Pins =
              {
                  "GP5", "GP6", "GP7", "GP8", "GP9", "GP10", "GP11", "GP12", "GP13", "GP14", "GP15",
                  "GP18", "GP19", "GP22", "GP26", "GP27", "GP28"
              };

              public static IReadOnlyList<string> AllowedPins => Pins;

              public static string NormalizeOrDefault(string? value)
                  => TryValidate(value, out var pin, out _) ? pin : "GP6";

              public static bool TryValidate(string? value, out string pin, out string error)
              {
                  pin = Normalize(value);
                  if (pin.Length == 0)
                  {
                      error = "Buzzer GPIO is required (default: GP6).";
                      return false;
                  }
                  if (pin is "GP3" or "GP4" or "GP16" or "GP17" or "GP20" or "GP21")
                  {
                      error = pin + " is reserved by the board contract and cannot drive the buzzer.";
                      return false;
                  }
                  if (!Pins.Contains(pin, StringComparer.Ordinal))
                  {
                      error = pin + " is not an allowed free PWM-capable Pico pin.";
                      return false;
                  }
                  error = "";
                  return true;
              }

              public static string Require(string? value)
              {
                  if (TryValidate(value, out var pin, out var error)) return pin;
                  throw new InvalidOperationException("خروجی متوقف شد: " + error);
              }

              private static string Normalize(string? value)
              {
                  var text = (value ?? "").Trim().ToUpperInvariant();
                  if (text.StartsWith("BOARD.", StringComparison.Ordinal)) text = text[6..];
                  return text;
              }
          }
          '''
          write(root / 'ams-shell/src/Ams.UI/Services/BuzzerGpioPolicy.cs', policy)

          pico_path = root / 'ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs'
          pico = pico_path.read_text(encoding='utf-8')
          pico = once(pico, 'string? pauseResumeHotkey = "Shift+F3")', 'string? pauseResumeHotkey = "Shift+F3", string buzzerGpio = "GP6")', 'BuildCodePy signature')
          pico = once(pico, '.Replace("__LOOP_SECONDS__", loopSeconds.ToString(CultureInfo.InvariantCulture));', '.Replace("__LOOP_SECONDS__", loopSeconds.ToString(CultureInfo.InvariantCulture))\n            .Replace("__BUZZER_GPIO__", buzzerGpio);', 'BuildCodePy replacements')
          pico = once(pico, 'tone = pwmio.PWMOut(board.GP6,', 'tone = pwmio.PWMOut(board.__BUZZER_GPIO__,', 'base buzzer template')
          pico = once(pico, 'string loopMode = "forever", int loopCount = 0, int loopSeconds = 0, bool keyboardOnArm = false)   // v0.9.44', 'string loopMode = "forever", int loopCount = 0, int loopSeconds = 0, bool keyboardOnArm = false, string buzzerGpio = "GP6")   // v0.9.44', 'BuildReadme signature')
          pico = once(pico, 'var settings = AppSettings.Load();\n        Put(string.IsNullOrWhiteSpace', 'var settings = AppSettings.Load();\n        var buzzerGpio = BuzzerGpioPolicy.Require(settings.BuzzerGpio);\n        Put(string.IsNullOrWhiteSpace', 'export setting load')
          pico = once(pico, 'settings.RunStopHotkey, settings.PauseResumeHotkey));', 'settings.RunStopHotkey, settings.PauseResumeHotkey, buzzerGpio));', 'export code call')
          pico = once(pico, 'BuildReadme(states, machine, loopMode, loopCount, loopSeconds, keyboardOnArm));', 'BuildReadme(states, machine, loopMode, loopCount, loopSeconds, keyboardOnArm, buzzerGpio));', 'export README call')
          start = pico.index('public static string BuildReadme')
          end = pico.index('public static IReadOnlyList<string> Export', start)
          region = pico[start:end]
          region = once(region, '        return sb.ToString();', '        sb.AppendLine();\n        sb.AppendLine("## Buzzer wiring");\n        sb.AppendLine("- Passive buzzer signal: Pico " + buzzerGpio + " (default GP6). Reserved pins are rejected.");\n        return sb.ToString();', 'README wiring')
          pico = pico[:start] + region + pico[end:]
          write(pico_path, pico)

          auto_path = root / 'ams-shell/src/Ams.UI/Services/AutoCycleFirmwareBundle.cs'
          auto = auto_path.read_text(encoding='utf-8')
          auto = once(auto, 'var written=PicoFirmwareExporter.Export(codePyPath,steps,machine,loopMode,loopCount,loopSeconds,keyboardOnArm).ToList();', 'var buzzerGpio=BuzzerGpioPolicy.Require(AppSettings.Load().BuzzerGpio); var written=PicoFirmwareExporter.Export(codePyPath,steps,machine,loopMode,loopCount,loopSeconds,keyboardOnArm,buzzerGpio).ToList();', 'AutoCycle export call')
          auto = once(auto, 'var patched=PatchCode(File.ReadAllText(full),Path.Combine(runtimeDir,PatchManifest));', 'var patched=PatchCode(File.ReadAllText(full),Path.Combine(runtimeDir,PatchManifest),buzzerGpio);', 'AutoCycle patch call')
          auto = once(auto, 'public static string PatchCode(string code,string manifestPath)', 'public static string PatchCode(string code,string manifestPath,string buzzerGpio="GP6")', 'PatchCode signature')
          auto = once(auto, 'code=NormalizeBuzzerForManifest(code);', 'code=NormalizeBuzzerForManifest(code,buzzerGpio);', 'manifest normalization call')
          auto = once(auto, 'private static string NormalizeBuzzerForManifest(string code)', 'private static string NormalizeBuzzerForManifest(string code,string buzzerGpio)', 'manifest normalization signature')
          pattern = r'        const string planGp6=.*?        return code\.Replace\(planGp6,planGp5,StringComparison\.Ordinal\);'
          replacement = '''        var selectedTone="tone = pwmio.PWMOut(board."+buzzerGpio+", duty_cycle=0,\\n                                frequency=int(freq)";
          const string planGp5="tone = pwmio.PWMOut(board.GP5, duty_cycle=0,\\n                                frequency=int(freq)";
          if(code.CountOccurrences(selectedTone)!=1)throw new InvalidDataException("قالب buzzer برای پین انتخابی قابل همگام‌سازی نیست: "+buzzerGpio);
          return code.Replace(selectedTone,planGp5,StringComparison.Ordinal);'''
          auto, n = re.subn(pattern, replacement, auto, count=1, flags=re.S)
          if n != 1: raise RuntimeError('AutoCycle buzzer normalization block not found')
          auto = once(auto, '        return code;\n    }\n    private static string NormalizeBuzzerForManifest', '        var manifestTone="tone = pwmio.PWMOut(board.GP6,";\n        code=code.Replace(manifestTone,"tone = pwmio.PWMOut(board."+buzzerGpio+",",StringComparison.Ordinal);\n        return code;\n    }\n    private static string NormalizeBuzzerForManifest', 'post-manifest buzzer selection')
          write(auto_path, auto)

          xaml_path = root / 'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml'
          xaml = xaml_path.read_text(encoding='utf-8')
          marker = '''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پوشه‌ی Toolkit" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ui:TextBox x:Name="ToolkitBox" FontFamily="Cascadia Code" Width="200" />
                </StackPanel>
'''
          addition = marker + '''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پین بازر Pico" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ComboBox x:Name="BuzzerGpioBox" Width="200" HorizontalContentAlignment="Right" />
                </StackPanel>
                <TextBlock Text="GP6 پیش‌فرض و سازگار با فایل‌های قدیمی است؛ GP3/GP4، GP16/GP17 و GP20/GP21 رزرو هستند." TextWrapping="Wrap" TextAlignment="Right" FontSize="11" Margin="0,2,0,0" Foreground="{StaticResource TextTertiaryBrush}" />
'''
          xaml = once(xaml, marker, addition, 'buzzer settings UI')
          write(xaml_path, xaml)

          opt_path = root / 'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml.cs'
          opt = opt_path.read_text(encoding='utf-8')
          opt = once(opt, 'public string KeyboardBoard { get; private set; } = "pico";', 'public string KeyboardBoard { get; private set; } = "pico";\n    public string BuzzerGpio { get; private set; } = "GP6";', 'OptionsDialog property')
          opt = once(opt, '        ToolkitBox.Text = toolkitDir;\n', '        ToolkitBox.Text = toolkitDir;\n        var buzzerSettings = Ams.UI.Models.AppSettings.Load();\n        BuzzerGpioBox.ItemsSource = Services.BuzzerGpioPolicy.AllowedPins;\n        BuzzerGpio = Services.BuzzerGpioPolicy.NormalizeOrDefault(buzzerSettings.BuzzerGpio);\n        BuzzerGpioBox.SelectedItem = BuzzerGpio;\n', 'OptionsDialog initialization')
          opt = once(opt, '        Finish(true);\n', '''        var selectedBuzzer = BuzzerGpioBox.SelectedItem as string;
        if (!Services.BuzzerGpioPolicy.TryValidate(selectedBuzzer, out var buzzerPin, out var buzzerError))
        {
            MessageBox.Show(buzzerError, "Buzzer GPIO", MessageBoxButton.OK, MessageBoxImage.Warning);
            return;
        }
        var savedBuzzerSettings = Ams.UI.Models.AppSettings.Load();
        savedBuzzerSettings.BuzzerGpio = buzzerPin;
        savedBuzzerSettings.Save();
        BuzzerGpio = buzzerPin;

        Finish(true);
''', 'OptionsDialog save')
          write(opt_path, opt)

          test_path = root / 'tests/BuzzerGpioPhase1Tests.cs'
          test = '''using System;
          using System.Runtime.CompilerServices;
          using Ams.UI.Services;

          namespace Ams.Tests;

          internal static class BuzzerGpioPhase1Tests
          {
              [ModuleInitializer]
              internal static void Run()
              {
                  if (BuzzerGpioPolicy.NormalizeOrDefault(null) != "GP6") throw new Exception("legacy buzzer default is not GP6");
                  if (!BuzzerGpioPolicy.TryValidate("GP7", out var pin, out _) || pin != "GP7") throw new Exception("GP7 was not accepted");
                  if (BuzzerGpioPolicy.TryValidate("GP20", out _, out _) || BuzzerGpioPolicy.TryValidate("GP3", out _, out _)) throw new Exception("reserved buzzer pin was accepted");
                  var code = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "phase1-test", buzzerGpio: "GP7");
                  if (!code.Contains("PWMOut(board.GP7", StringComparison.Ordinal)) throw new Exception("GP7 did not reach generated code.py");
                  if (code.Contains("PWMOut(board.GP6", StringComparison.Ordinal)) throw new Exception("generated code.py still contains hardcoded GP6 buzzer output");
              }
          }
          '''
          write(test_path, test)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ams-shell tests
          git commit -m "feat: make Pico buzzer GPIO configurable" || exit 1
          git push origin HEAD:phase1/configurable-buzzer-gpio
          git rm .github/workflows/apply-phase1-buzzer.yml
          git commit -m "chore: remove phase 1 apply helper"
          git push origin HEAD:phase1/configurable-buzzer-gpio
