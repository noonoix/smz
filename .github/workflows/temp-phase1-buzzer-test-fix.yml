name: temp-phase1-buzzer-test-fix

on:
  push:
    branches:
      - phase1/configurable-buzzer-gpio

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Update stale buzzer contract assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/TestRunner.cs')
          s = p.read_text()
          old = '''        var buzFw = V27ReadSrc(Path.Combine("Services", "PicoFirmwareExporter.cs"));
        Assert(buzFw.Contains("PWMOut(board.GP6") && !buzFw.Contains("PWMOut(board.GP5") && !buzFw.Contains("board.D9"),
            "custom buzzer: passive PWM is Pico GP6 only");'''
          new = '''        var buzFw = V27ReadSrc(Path.Combine("Services", "PicoFirmwareExporter.cs"));
        var buzGp6 = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "TEST", buzzerGpio: "GP6");
        var buzGp7 = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "TEST", buzzerGpio: "GP7");
        Assert(buzFw.Contains("PWMOut(board.__BUZZER_GPIO__")
               && buzGp6.Contains("PWMOut(board.GP6")
               && buzGp7.Contains("PWMOut(board.GP7")
               && !buzGp7.Contains("PWMOut(board.GP6")
               && !buzFw.Contains("PWMOut(board.GP5")
               && !buzFw.Contains("board.D9"),
            "custom buzzer: passive PWM uses the selected Pico GPIO (GP6 default, GP7 supported)");'''
          if old not in s:
              raise SystemExit('expected buzzer contract assertion was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix to phase1 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TestRunner.cs
          git diff --cached --quiet || (git commit -m "fix: update buzzer contract test" && git push origin HEAD:${GITHUB_REF_NAME})
