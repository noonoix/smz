name: Compile diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and capture compiler output
        id: compile
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet restore ams-shell/AMS.sln
          dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object compile-output.txt
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Publish compiler diagnostics
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('compile-output.txt', 'utf8'); } catch {}
            if (log.length > 12000) log = log.slice(-12000);
            const status = process.env.EXIT_CODE === '0' ? 'succeeded' : 'failed';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Compile diagnostic — ${status} — run #${context.runNumber}`,
              body: `**Commit:** ${context.sha}\n**Exit code:** ${process.env.EXIT_CODE}\n\n\`\`\`text\n${log}\n\`\`\``
            });
            if (process.env.EXIT_CODE !== '0') core.setFailed('Compile failed; diagnostics were posted to the issue.');
