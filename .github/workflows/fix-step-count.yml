name: Fix stale step-count test
on:
  push:
    branches: [feature/error-step-timeout-ui]
    paths:
      - .github/workflows/fix-step-count.yml
      - tools/fix-step-count.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix test and remove temporary files
        run: python3 tools/fix-step-count.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/TestRunner.cs
          git rm .github/workflows/fix-step-count.yml tools/fix-step-count.py ams-shell/.ci-trigger
          git commit -m "Update insertion-surface count for error step"
          git push
