name: ARM 2.7 firmware

on:
  push:
    branches: [fix/v32-profile-and-bundle]
    paths:
      - 'firmware/arm26/**'
      - 'firmware/arm27/**'
      - '.github/workflows/arm27.yml'
  pull_request:
    paths:
      - 'firmware/arm26/**'
      - 'firmware/arm27/**'
      - '.github/workflows/arm27.yml'

permissions:
  contents: read
  issues: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Pro Micro core and HID library
        id: install
        shell: bash
        continue-on-error: true
        run: |
          set +e
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/sparkfun/Arduino_Boards/main/IDE_Board_Manager/package_sparkfun_index.json 2>&1 | tee arm27-install.log
          arduino-cli core update-index 2>&1 | tee -a arm27-install.log
          arduino-cli core install SparkFun:avr 2>&1 | tee -a arm27-install.log
          arduino-cli lib install HID-Project 2>&1 | tee -a arm27-install.log
          code=${PIPESTATUS[0]}
          arduino-cli core list | tee -a arm27-install.log
          arduino-cli lib list | grep -i HID | tee -a arm27-install.log
          if ! arduino-cli core list | grep -q 'SparkFun:avr'; then code=1; fi
          if ! arduino-cli lib list | grep -qi 'HID-Project'; then code=1; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare deterministic sketch layout
        if: steps.install.outputs.code == '0'
        run: |
          mkdir -p /tmp/arm27 /tmp/arm26
          cp firmware/arm27/ams_board27.ino /tmp/arm27/arm27.ino
          cp firmware/arm27/human_mouse_v3.h /tmp/arm27/
          cp firmware/arm26/ams_board26.ino /tmp/arm26/
          cp firmware/arm26/ams_key.h /tmp/arm26/
      - name: Compile for Pro Micro ATmega32U4 5V/16MHz
        if: steps.install.outputs.code == '0'
        id: avr
        shell: bash
        continue-on-error: true
        run: |
          set +e
          arduino-cli compile --fqbn 'SparkFun:avr:promicro:cpu=16MHzatmega32U4' --warnings all /tmp/arm27 2>&1 | tee arm27-compile.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish failed setup or compiler output
        if: steps.install.outputs.code != '0' || steps.avr.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            for (const name of ['arm27-install.log','arm27-compile.log']) {
              if (fs.existsSync(name)) log += `\n--- ${name} ---\n` + fs.readFileSync(name,'utf8');
            }
            if (log.length > 12000) log = log.slice(-12000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ARM 2.7 compile diagnostic — ${context.sha.slice(0, 12)}`,
              body: `Automated diagnostic for ${context.sha}.\n\n\`\`\`text\n${log}\n\`\`\``
            });
      - name: Enforce compiler result
        if: steps.install.outputs.code != '0' || steps.avr.outputs.code != '0'
        run: exit 1
