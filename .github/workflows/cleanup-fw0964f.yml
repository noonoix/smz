name: Clean verified firmware PR
on:
  push:
    branches: [fix/exported-firmware-0964f]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - name: Verify clean source tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
          python tools/make_fw_template_0.9.64f.py .
          dotnet run --project tests/TestRunner.csproj -c Release
      - name: Remove generated files and commit
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/cleanup-fw0964f.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove generated test artifacts'
          git push
