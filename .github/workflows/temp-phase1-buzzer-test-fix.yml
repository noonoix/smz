name: temp-phase1-buzzer-test-fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch stale buzzer contract assertion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'phase1/configurable-buzzer-gpio';
            const path = 'tests/TestRunner.cs';
            const oldText = `        var buzFw = V27ReadSrc(Path.Combine("Services", "PicoFirmwareExporter.cs"));
            Assert(buzFw.Contains("PWMOut(board.GP6") && !buzFw.Contains("PWMOut(board.GP5") && !buzFw.Contains("board.D9"),
                "custom buzzer: passive PWM is Pico GP6 only");`;
            const newText = `        var buzFw = V27ReadSrc(Path.Combine("Services", "PicoFirmwareExporter.cs"));
            var buzGp6 = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "TEST", buzzerGpio: "GP6");
            var buzGp7 = PicoFirmwareExporter.BuildCodePy(Array.Empty<PicoFirmwareExporter.LightState>(), "TEST", buzzerGpio: "GP7");
            Assert(buzFw.Contains("PWMOut(board.__BUZZER_GPIO__")
                   && buzGp6.Contains("PWMOut(board.GP6")
                   && buzGp7.Contains("PWMOut(board.GP7")
                   && !buzGp7.Contains("PWMOut(board.GP6")
                   && !buzFw.Contains("PWMOut(board.GP5")
                   && !buzFw.Contains("board.D9"),
                "custom buzzer: passive PWM uses the selected Pico GPIO (GP6 default, GP7 supported)");`;
            const file = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            if (Array.isArray(file.data) || !file.data.content) core.setFailed('TestRunner.cs content was not returned');
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');
            if (!current.includes(oldText)) {
              core.info('Buzzer contract assertion already updated or exact text not found; no write performed.');
              return;
            }
            const updated = current.replace(oldText, newText);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'fix: update buzzer contract test',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: file.data.sha
            });
