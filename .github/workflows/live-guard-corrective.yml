name: Live guard corrective patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch engine
        run: python3 tools/apply_live_light_guard.py
      - name: Push engine fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portable/plan3/CIRCUITPY/plan_engine.py
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "fix: apply live light guard executor correction"
            git push
          fi
