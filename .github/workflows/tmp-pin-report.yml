name: tmp-pin-report

# TEMPORARY. Investigates the version-pin failures of CI run #19 without
# pulling the 239 KB TestRunner.cs through the assistant's context: the job
# greps the pins server-side and commits a small report back to this branch.
# Delete this workflow once the pins are fixed.

on:
  push:
    branches: [fix/version-pins-0964]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the pin report
        run: python3 tools/_pin_report.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pin-report.txt
          git commit -m "chore(tmp): version-pin context report for CI run #19"
          git push origin HEAD:fix/version-pins-0964
