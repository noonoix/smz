name: apply-plan-exporter (temporary)

# TEMPORARY bootstrap workflow for branch feat/plan-exporter-plan1 (deleted before the PR merges):
# build.yml only triggers on main, so this mirrors it on windows-latest to apply
# tools/patch_plan_exporter_ui.py to the real tree, prove build + TestRunner + the twin sim
# green, and commit the patched files back to the branch (github-actions[bot]).
# Every step tees into ci-progress.txt so a failure issue shows the REAL error (the build/test
# logs live in ci-test-output.txt). On failure an issue opens with both logs.

on:
  workflow_dispatch:
  push:
    branches: [feat/plan-exporter-plan1]

permissions:
  contents: write   # commit the patched files back to the branch
  issues: write     # open an issue on failure

jobs:
  apply:
    runs-on: windows-latest
    # never react to our own commit-back (no loops)
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # all four python steps in one, each teed into ci-progress.txt with an explicit exit check
      # (pwsh does not fail a step on a native non-zero exit unless we check $LASTEXITCODE)
      - name: Generate + patch + sim + compile-check
        shell: pwsh
        run: |
          "=== python $(python --version 2>&1) ===" | Tee-Object ci-progress.txt
          "--- make_plan_exporter ---" | Tee-Object ci-progress.txt -Append
          python tools/make_plan_exporter.py . *>&1 | Tee-Object ci-progress.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "--- patch_plan_exporter_ui ---" | Tee-Object ci-progress.txt -Append
          python tools/patch_plan_exporter_ui.py . *>&1 | Tee-Object ci-progress.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "--- sim_plan_export ---" | Tee-Object ci-progress.txt -Append
          python sim/sim_plan_export.py *>&1 | Tee-Object ci-progress.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "--- py_compile ---" | Tee-Object ci-progress.txt -Append
          python -m py_compile tools/plan_export_twin.py tools/make_plan_exporter.py tools/patch_plan_exporter_ui.py sim/sim_plan_export.py *>&1 | Tee-Object ci-progress.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "--- python pipeline OK ---" | Tee-Object ci-progress.txt -Append

      - name: Restore
        run: dotnet restore ams-shell/AMS.sln

      - name: Build (Release)
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore

      # same lesson as build.yml: wipe committed tests/bin + tests/obj first, real csproj,
      # stderr merged into the log
      - name: Build TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release *>&1 | Tee-Object ci-progress.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run TestRunner
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object ci-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path ci-test-output.txt -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Commit the patched files
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/src/Ams.UI/Services/PlanExporter.cs ams-shell/src/Ams.UI/ViewModels/MainViewModel.cs ams-shell/src/Ams.UI/MainWindow.xaml tests/TestRunner.cs
          if (git diff --cached --quiet) { echo "nothing to commit (already applied)" } else {
            git commit -m "chore(plan-exporter): apply UI + TestRunner wiring (automated patcher run)"
          }
          (Select-String -Path ci-test-output.txt -Pattern '=== Results' | Select-Object -Last 1).Line | Out-File apply-report.txt -Encoding ascii
          git add apply-report.txt
          if (git diff --cached --quiet) { echo "report unchanged" } else { git commit -m "chore(plan-exporter): apply report [skip-tmp]" }
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; } };
            const progress = read('ci-progress.txt').trim();
            const testLog = read('ci-test-output.txt');
            const failLines = testLog.split('\n').filter(l => /^(FAIL:)|error CS|error MSB|Build FAILED/i.test(l)).slice(-40);
            const tail = testLog.split('\n').slice(-40).join('\n');
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `plan-exporter apply failed — run #${context.runNumber}`,
              body: '**Run:** ' + runUrl
                + '\n\n**Progress log (generator/patcher/sim/build):**\n```\n' + (progress.slice(-3500) || '(empty)') + '\n```'
                + '\n\n**Failure lines (test log):**\n```\n' + (failLines.join('\n') || '(none matched)') + '\n```'
                + '\n\n**Test log tail:**\n```\n' + (tail || '(no test log)') + '\n```'
            });
