name: fix launch action parity test
on:
  push:
    branches: [fix/expose-launch-recovery-action]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/expose-launch-recovery-action
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/TestRunner.cs')
          s=p.read_text(encoding='utf-8')
          old='''        Assert(v43insert.Count == 23,\n            $"v0.9.43: the Insert tab still lists 23 step types (got {v43insert.Count})");'''
          new='''        Assert(v43insert.Count == 24,\n            $"the Insert menu lists all 24 step types, including Launch DC Recovery (got {v43insert.Count})");'''
          if s.count(old)!=1: raise SystemExit('expected one parity assertion')
          p.write_text(s.replace(old,new),encoding='utf-8')
          Path('.github/workflows/fix-launch-action-test.yml').unlink()
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: include Launch recovery in action parity"
          git push
