name: Sensitive artifact guard
on:
  push:
    branches: [feat/portable-plan2-app-0966]
  pull_request:
permissions:
  contents: read
jobs:
  sensitive-guard:
    name: security / sensitive-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_sensitive_artifacts.py .
