name: apply-error-policy-fix

on:
  push:
    branches: [fix/remove-vertical-rail-tooltips]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply shared error policy runtime wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-vertical-rail-tooltips
          fetch-depth: 0

      - name: Apply source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'ams-shell/src/Ams.UI/Services/RunEngine.cs',
              '    public sealed class SilentStop : Exception { }\n',
              '''    public sealed class SilentStop : Exception { }\n\n    /// <summary>Internal control-flow exception used after a timeout policy has\n    /// recorded/alarmed the error. It must not be alarmed a second time by the UI.\n    /// </summary>\n    public sealed class PolicyStop : Exception\n    {\n        public PolicyStop(bool alarmed) => Alarmed = alarmed;\n        public bool Alarmed { get; }\n    }\n''')

          replace(
              'ams-shell/src/Ams.UI/Services/RunEngine.cs',
              '''            // a sound window expiring is a normal outcome, not a fatal error (§3.3.1 group E)\n            if (allowTimeout && reply.StartsWith("ERR|TIMEOUT", StringComparison.Ordinal))\n            {\n                _log("sound window expired (timeout) — continuing");\n                return reply;\n            }\n''',
              '''            if (allowTimeout && reply.StartsWith("ERR|TIMEOUT", StringComparison.Ordinal))\n            {\n                var policy = ErrorPolicyBootstrap.Settings.TimeoutPolicy;\n                if (policy == "continue")\n                {\n                    _log("wait window expired (timeout) — continuing by policy");\n                    return reply;\n                }\n\n                if (policy == "stopQuiet")\n                {\n                    _log("wait window expired (timeout) — stopping quietly by policy");\n                    throw new PolicyStop(alarmed: false);\n                }\n\n                var timeout = new TimeoutException($"Board wait timed out: {cmd}");\n                ErrorPolicyBootstrap.Handle(timeout, "timeout");\n                _log("wait window expired (timeout) — stopping with alarm by policy");\n                throw new PolicyStop(alarmed: true);\n            }\n''')

          replace(
              'ams-shell/src/Ams.UI/Services/ErrorPolicyBootstrap.cs',
              '        if (error is OperationCanceledException || error is RunEngine.SilentStop) return false;\n',
              '        if (error is OperationCanceledException || error is RunEngine.SilentStop || error is RunEngine.PolicyStop) return false;\n')

          replace(
              'ams-shell/src/Ams.UI/ViewModels/MainViewModel.cs',
              '        catch (Exception ex) { Log("run error: " + ex.Message); }\n',
              '        catch (Exception ex) { ErrorPolicyBootstrap.Handle(ex, "run"); Log("run error: " + ex.Message); }\n')

          replace(
              'ams-shell/src/Ams.UI/ViewModels/MainViewModel.cs',
              '''    private void Stop()\n    {\n\n        if (IsRunning)\n''',
              '''    private void Stop()\n    {\n        // A user-requested Stop is not a fatal error, but it must silence any\n        // active repeating alarm immediately.\n        ErrorPolicyBootstrap.Acknowledge();\n\n        if (IsRunning)\n''')

          # The one-shot workflow should not remain in the feature branch after applying its edits.
          Path('.github/workflows/apply-error-policy-fix.yml').unlink()
          PY

      - name: Commit applied changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply shared error policy runtime wiring"
          git push origin HEAD:fix/remove-vertical-rail-tooltips
