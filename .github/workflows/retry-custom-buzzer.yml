name: retry custom GP6 buzzer patch
on:
  push:
    branches: [feat/custom-gp6-buzzer]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-gp6-buzzer
      - name: Correct anchor and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_custom_buzzer.py')
          s=p.read_text(encoding='utf-8')
          old="marker2='    public static StepDefinition Get(string type)\\n'"
          new="marker2='    public static StepDefinition Get'"
          if s.count(old)!=1: raise SystemExit('old anchor not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          Path('patch-custom-buzzer.log').unlink(missing_ok=True)
          PY
          python tools/apply_custom_buzzer.py
          rm -f .github/workflows/retry-custom-buzzer.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace Play Audio insertion with custom GP6 buzzer"
          git push
