name: Apply live light guard runtime

on:
  push:
    branches: [main]
    paths:
      - "tools/apply_live_light_guard.py"
      - "portable/plan3/CIRCUITPY/live_light_guard.py"
      - "portable/plan3/CIRCUITPY/plan_engine.py"
      - "portable/plan3/sim/test_live_light_guard.py"
      - ".github/workflows/apply-live-light-guard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guard tests
        run: python3 -m unittest discover -s portable/plan3/sim -p 'test_live_light_guard.py' -v
      - name: Patch canonical portable engine
        run: python3 tools/apply_live_light_guard.py
      - name: Commit patched engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portable/plan3/CIRCUITPY/plan_engine.py
          if git diff --cached --quiet; then
            echo "No engine changes needed"
          else
            git commit -m "feat: add live light state routing to plan engine"
            git push
          fi
