name: Diagnose accepted firmware 0.9.64f
on:
  push:
    branches: [fix/exported-firmware-0964f]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - name: Reconstruct and test with report
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force project-state | Out-Null
          $ErrorActionPreference='Continue'
          & {
            $b64=((Get-ChildItem .github/fwparts/part*|Sort-Object Name|ForEach-Object {Get-Content $_.FullName -Raw})-join '')
            "base64_chars=$($b64.Length)"
            [IO.File]::WriteAllBytes('fw.tgz',[Convert]::FromBase64String($b64))
            "archive_bytes=$((Get-Item fw.tgz).Length)"
            tar -tzf fw.tgz
            if($LASTEXITCODE -ne 0){throw 'tar list failed'}
            tar -xzf fw.tgz
            if($LASTEXITCODE -ne 0){throw 'tar extract failed'}
            python tools/make_fw_template_0.9.64f.py .
            if($LASTEXITCODE -ne 0){throw 'template generator failed'}
            python tools/prepare_release_patch_0965.py
            if($LASTEXITCODE -ne 0){throw 'release patch prep failed'}
            $codeHash=(Get-FileHash firmware/code64f/code.py -Algorithm SHA256).Hash.ToLower(); "code_sha256=$codeHash"
            $armHash=(Get-FileHash firmware/arm25/ams_board25.ino -Algorithm SHA256).Hash.ToLower(); "arm_sha256=$armHash"
            if($codeHash -ne '1d1afe089f938968f71e1f67ea4ea6495c072756d3214b7c24e1830a269a565a'){throw 'code hash mismatch'}
            if($armHash -ne '4b54d04b328ea7a375daa82786fab733d9ae2055a21f6f72cc1a42164266c16c'){throw 'arm hash mismatch'}
            Remove-Item -Recurse -Force tests/bin,tests/obj -ErrorAction SilentlyContinue
            dotnet run --project tests/TestRunner.csproj -c Release
            if($LASTEXITCODE -ne 0){throw 'TestRunner failed'}
            'FINAL=PASS'
          } *>&1 | Tee-Object project-state/fw0964f-diagnostic.txt
          if($Error.Count -gt 0){'FINAL=FAIL' | Add-Content project-state/fw0964f-diagnostic.txt; exit 1}
      - name: Commit diagnostic
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-state/fw0964f-diagnostic.txt
          git commit -m 'ci: record firmware reconstruction diagnostic'
          git push
