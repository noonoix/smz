name: PLAN2 app validation

on:
  push:
    branches: [feat/portable-plan2-app-0966]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exporter:
    name: plan2-app / build-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply PLAN2 parity, generate exporter and synchronize Step 59
        run: |
          python tools/upgrade_plan_exporter_plan2.py .
          python tools/make_plan_exporter.py .
          python tools/sync_plan_exporter_tests.py .
      - name: Compile-check bridge stack
        run: python -m py_compile ams-shell/bridge/bridge.py ams-shell/bridge/ams_serial.py ams-shell/bridge/ams_crypto.py
      - name: Behavior-test Pico brain transport
        run: python tools/test_bridge_pico.py
      - name: Restore and build app
        run: |
          dotnet restore ams-shell/AMS.sln
          dotnet build ams-shell/AMS.sln -c Release --no-restore
      - name: Build TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object ci-plan2-build-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run TestRunner
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object ci-plan2-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path ci-plan2-test-output.txt -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Persist generated sources and green report
        if: success()
        shell: pwsh
        run: |
          $result = (Select-String -Path ci-plan2-test-output.txt -Pattern '=== Results' | Select-Object -Last 1).Line
          @('# PLAN2 Windows gate report','', '- generation: success','- C# PLAN2 parity migration: applied','- bridge compile: success','- bridge test: success','- restore: success','- app build: success','- TestRunner build: success','- TestRunner run: success','',"- result: $result") | Set-Content docs/PLAN2-WINDOWS-GATE.md -Encoding utf8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/PlanExporter.cs.tpl ams-shell/src/Ams.UI/Services/PlanExporter.cs tools/plan_exporter_test_step.cs.inc tests/TestRunner.cs docs/PLAN2-WINDOWS-GATE.md
          git commit -m "feat(plan2): migrate C# exporter emitters and validator" || echo "no generated change"
          git push
