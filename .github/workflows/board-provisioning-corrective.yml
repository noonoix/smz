name: Board provisioning corrective integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe USB application update path
        run: python3 tools/apply_board_usb_provisioning.py
      - name: Verify provisioning contract
        run: |
          python3 tools/test_usb_provisioning_contract.py
          git diff --check
      - name: Commit integrated board preparation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/src/Ams.UI/Views/BoardPrepWindow.xaml.cs ams-shell/src/Ams.UI/Views/BoardPrepWindow.xaml
          if git diff --cached --quiet; then
            echo "Board provisioning integration already applied"
          else
            git commit -m "feat: route application updates through USB without ISP"
            git push
          fi
