name: apply mouse stop release fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/apply_mouse_stop_release_fix.py'
      - 'ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs'
      - 'firmware/pico-light-0.9.60-template.py'
      - 'firmware/code64f/code.py'
      - 'firmware/arm26/ams_board26.ino'
      - '.github/workflows/mouse-stop-release-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply tested Mouse Stop source fix
        run: python tools/apply_mouse_stop_release_fix.py
      - name: Commit the durable source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Mouse Stop fix already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs firmware/pico-light-0.9.60-template.py firmware/code64f/code.py firmware/arm26/ams_board26.ino
          git commit -m 'fix: make MCLICK stop abortable end to end'
          git push origin HEAD:main
