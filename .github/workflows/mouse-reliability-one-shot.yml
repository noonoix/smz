name: mouse reliability one-shot

on:
  push:
    branches: [phase1/configurable-buzzer-gpio]
    paths:
      - tools/apply_mouse_reliability.py
      - .github/workflows/mouse-reliability-one-shot.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/configurable-buzzer-gpio
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply deterministic source patch
        run: python tools/apply_mouse_reliability.py
      - name: Validate bridge syntax
        run: python -m py_compile ams-shell/bridge/bridge.py
      - name: Build application
        run: dotnet build ams-shell/AMS.sln -c Release
      - name: Run regression suite
        run: dotnet run --project tests/TestRunner.csproj -c Release
      - name: Commit verified patch and remove one-shot helpers
        shell: pwsh
        run: |
          Remove-Item tools/apply_mouse_reliability.py
          Remove-Item .github/workflows/mouse-reliability-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mouse stop completion and host event flood"
          git push origin HEAD:phase1/configurable-buzzer-gpio
