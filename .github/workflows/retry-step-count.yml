name: Retry stale step-count correction
on:
  push:
    branches: [feature/error-step-timeout-ui]
    paths:
      - .github/workflows/retry-step-count.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/TestRunner.cs')
          s = p.read_text(encoding='utf-8')
          if 'Assert(v43insert.Count == 24,' not in s:
              raise SystemExit('expected stale assertion was not found')
          p.write_text(s.replace('Assert(v43insert.Count == 24,', 'Assert(v43insert.Count == 25,', 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/TestRunner.cs
          git commit -m "Correct insertion-surface step-count assertion"
          git push
