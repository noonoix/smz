name: Phase 1 migration v5

on:
  push:
    branches: [phase1/configurable-buzzer-gpio]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply settings UI and AutoCycle propagation
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          def once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise RuntimeError(f'{label}: expected 1 match, found {n}')
              return text.replace(old,new,1)

          auto_path=root/'ams-shell/src/Ams.UI/Services/AutoCycleFirmwareBundle.cs'
          auto=auto_path.read_text(encoding='utf-8')
          old='        const string planGp6="tone = pwmio.PWMOut(board.GP6, duty_cycle=0,\\n                                frequency=int(freq)";'
          new='        var planGp6="tone = pwmio.PWMOut(board."+BuzzerGpioPolicy.Require(AppSettings.Load().BuzzerGpio)+", duty_cycle=0,\\n                                frequency=int(freq)";'
          if auto.count(old)!=1: raise RuntimeError('AutoCycle GP6 normalization anchor not found exactly once')
          auto=auto.replace(old,new,1)
          anchor='        return code;\n    }\n    private static string NormalizeBuzzerForManifest'
          replacement='        code=code.Replace("tone = pwmio.PWMOut(board.GP6,","tone = pwmio.PWMOut(board."+BuzzerGpioPolicy.Require(AppSettings.Load().BuzzerGpio)+",",StringComparison.Ordinal);\n        return code;\n    }\n    private static string NormalizeBuzzerForManifest'
          auto=once(auto,anchor,replacement,'AutoCycle selected pin')
          auto_path.write_text(auto,encoding='utf-8')

          xaml_path=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml'
          xaml=xaml_path.read_text(encoding='utf-8')
          marker='''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پوشه‌ی Toolkit" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ui:TextBox x:Name="ToolkitBox" FontFamily="Cascadia Code" Width="200" />
                </StackPanel>
'''
          addition=marker+'''                <StackPanel Orientation="Horizontal" Margin="0,8,0,4">
                    <TextBlock Text="پین بازر Pico" Foreground="{StaticResource TextSecondaryBrush}" Width="120" VerticalAlignment="Center" />
                    <ComboBox x:Name="BuzzerGpioBox" Width="200" HorizontalContentAlignment="Right" />
                </StackPanel>
                <TextBlock Text="GP6 پیش‌فرض و سازگار با فایل‌های قدیمی است؛ GP3/GP4، GP16/GP17 و GP20/GP21 رزرو هستند." TextWrapping="Wrap" TextAlignment="Right" FontSize="11" Margin="0,2,0,0" Foreground="{StaticResource TextTertiaryBrush}" />
'''
          xaml=once(xaml,marker,addition,'buzzer settings XAML')
          xaml_path.write_text(xaml,encoding='utf-8')

          opt_path=root/'ams-shell/src/Ams.UI/Views/OptionsDialog.xaml.cs'
          opt=opt_path.read_text(encoding='utf-8')
          opt=once(opt,'public string KeyboardBoard { get; private set; } = "pico";','public string KeyboardBoard { get; private set; } = "pico";\n    public string BuzzerGpio { get; private set; } = "GP6";','buzzer property')
          opt=once(opt,'        ToolkitBox.Text = toolkitDir;\n','        ToolkitBox.Text = toolkitDir;\n        var buzzerSettings = Ams.UI.Models.AppSettings.Load();\n        BuzzerGpioBox.ItemsSource = Services.BuzzerGpioPolicy.AllowedPins;\n        BuzzerGpio = Services.BuzzerGpioPolicy.NormalizeOrDefault(buzzerSettings.BuzzerGpio);\n        BuzzerGpioBox.SelectedItem = BuzzerGpio;\n','buzzer initialization')
          save='''        var selectedBuzzer = BuzzerGpioBox.SelectedItem as string;
        if (!Services.BuzzerGpioPolicy.TryValidate(selectedBuzzer, out var buzzerPin, out var buzzerError))
        {
            MessageBox.Show(buzzerError, "Buzzer GPIO", MessageBoxButton.OK, MessageBoxImage.Warning);
            return;
        }
        var savedBuzzerSettings = Ams.UI.Models.AppSettings.Load();
        savedBuzzerSettings.BuzzerGpio = buzzerPin;
        savedBuzzerSettings.Save();
        BuzzerGpio = buzzerPin;

        Finish(true);
'''
          opt=once(opt,'        Finish(true);\n',save,'buzzer save')
          opt_path.write_text(opt,encoding='utf-8')

          for name in ['phase1-debug.txt','phase1-v3-debug.txt','phase1-v4-debug.txt','phase1-trigger.txt','phase1-trigger-2.txt']:
              p=root/name
              if p.exists(): p.unlink()
          for name in ['apply-phase1-buzzer.yml','phase1-migration-v2.yml','phase1-migration-v3.yml','phase1-migration-v4.yml']:
              p=root/'.github/workflows'/name
              if p.exists(): p.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ams-shell tests .github/workflows
          git commit -m "feat: add buzzer GPIO settings and AutoCycle propagation"
          git push origin HEAD:phase1/configurable-buzzer-gpio
