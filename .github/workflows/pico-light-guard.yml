name: Pico combined light Guard firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/pico-light-guard-1.0.0/**'
      - 'portable/plan3/CIRCUITPY/**'
      - '.github/workflows/pico-light-guard.yml'

permissions:
  contents: read

jobs:
  validate-guard:
    name: pico-light-guard / validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile combined firmware sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            firmware/pico-light-guard-1.0.0/boot.py \
            firmware/pico-light-guard-1.0.0/code.py \
            firmware/pico-light-guard-1.0.0/combined_guard_runtime.py \
            firmware/pico-light-guard-1.0.0/guard_calibration_protocol.py \
            portable/plan3/CIRCUITPY/guard_calibration_protocol.py

      - name: Enforce combined Guard boundary
        shell: bash
        run: |
          set -euo pipefail
          root=firmware/pico-light-guard-1.0.0
          runtime="$root/combined_guard_runtime.py"
          grep -q 'usb_cdc.enable(console=True, data=True)' "$root/boot.py"
          grep -q 'usb_hid' "$root/boot.py"
          grep -q 'from combined_guard_runtime import main' "$root/code.py"
          grep -q 'from guard_calibration_protocol import build_calibration_get, parse_calibration_set' "$runtime"
          grep -q 'board.GP20' "$runtime"
          grep -q 'board.GP21' "$runtime"
          grep -q 'board.GP4' "$runtime"
          grep -q 'board.GP3' "$runtime"
          grep -q 'board.GP6' "$runtime"
          grep -q 'board.GP16' "$runtime"
          grep -q 'board.GP17' "$runtime"
          grep -q 'baudrate=57600' "$runtime"
          grep -q 'load_guard_bundle' "$runtime"
          grep -q 'GuardBundleError' "$runtime"
          grep -q 'plan_engine.run_plan' "$runtime"
          grep -q 'short UART write' "$runtime"
          grep -q 'self.pending >= 2' "$runtime"
          grep -q 'self.arm.abort' "$runtime"
          grep -q 'self.controls.paused' "$runtime"
          grep -q 'self.stage = 0' "$runtime"
          grep -q 'seconds=5' "$runtime"
          grep -q 'PROFILEs' "$runtime" || grep -q 'PROFILES' "$runtime"
          grep -q 'CALGET' "$runtime"
          grep -q 'CALSET' "$runtime"
          grep -q 'HASHED_BUNDLE_FILES' "$runtime"
          grep -q 'def _hash_manifest' "$runtime"
          grep -q 'self._replace_text("/SHA256SUMS.txt", self._hash_manifest())' "$runtime"
          grep -q 'old_hashes = self._read_text("/SHA256SUMS.txt")' "$runtime"
          grep -q '("/SHA256SUMS.txt", old_hashes)' "$runtime"
          ! grep -Eq 'usb_hid\.disable|role=light-guard.*hid=off|RunEngine' "$runtime"

      - name: Test combined Guard calibration protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 portable/plan3/sim/test_combined_guard_calibration_protocol.py

      - name: Package combined Guard firmware
        shell: bash
        run: |
          set -euo pipefail
          root=firmware/pico-light-guard-1.0.0
          find "$root" -type d -name '__pycache__' -prune -exec rm -rf {} +
          zip -qr pico-light-guard-1.0.0.zip "$root"
          sha256sum pico-light-guard-1.0.0.zip | awk '{print toupper($1)}' > pico-light-guard-1.0.0-sha256.txt
          cat pico-light-guard-1.0.0-sha256.txt

      - name: Upload combined Guard package
        uses: actions/upload-artifact@v4
        with:
          name: pico-light-guard-1.0.0
          path: |
            pico-light-guard-1.0.0.zip
            pico-light-guard-1.0.0-sha256.txt
          retention-days: 14
          if-no-files-found: error
