name: ARM 2.7 firmware

on:
  push:
    branches: [fix/v32-profile-and-bundle]
    paths:
      - 'firmware/arm26/**'
      - 'firmware/arm27/**'
      - '.github/workflows/arm27.yml'
  pull_request:
    paths:
      - 'firmware/arm26/**'
      - 'firmware/arm27/**'
      - '.github/workflows/arm27.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and HID library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install HID-Project
      - name: Prepare deterministic sketch layout
        run: |
          mkdir -p /tmp/arm27 /tmp/arm26
          cp firmware/arm27/ams_board27.ino /tmp/arm27/arm27.ino
          cp firmware/arm27/human_mouse_v3.h /tmp/arm27/
          cp firmware/arm26/ams_board26.ino /tmp/arm26/
          cp firmware/arm26/ams_key.h /tmp/arm26/
      - name: Compile for ATmega32U4
        run: arduino-cli compile --fqbn arduino:avr:leonardo --warnings all /tmp/arm27
