name: Guard hardware monitor
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/GuardHardwareMonitor/**'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish monitor
        run: dotnet publish tools/GuardHardwareMonitor/GuardHardwareMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/GuardHardwareMonitor
      - name: Copy documentation
        shell: pwsh
        run: Copy-Item tools/GuardHardwareMonitor/README-FA.md publish/GuardHardwareMonitor/README-FA.md
      - uses: actions/upload-artifact@v4
        with:
          name: GuardHardwareMonitor-win-x64
          path: publish/GuardHardwareMonitor
