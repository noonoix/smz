name: Apply Classroom Studio UI fixes

on:
  push:
    branches:
      - fix/classroom-studio-ui-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply_classroom_studio_ui_fixes.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/src/Ams.UI
          git commit -m "fix(ui): complete Classroom Studio action editor refresh"
          git push
