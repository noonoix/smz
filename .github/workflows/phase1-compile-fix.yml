name: Phase 1 compile fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize-exporter:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Rename conflicting local variable
        shell: bash
        run: |
          set -euo pipefail
          file='ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ams-shell/src/Ams.UI/Services/PicoFirmwareExporter.cs')
          s = p.read_text(encoding='utf-8')
          old = '        var buzzerGpio = BuzzerGpioPolicy.Require(settings.BuzzerGpio);'
          new = '        var selectedBuzzerGpio = BuzzerGpioPolicy.Require(settings.BuzzerGpio);'
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('settings.RunStopHotkey, settings.PauseResumeHotkey, buzzerGpio));', 'settings.RunStopHotkey, settings.PauseResumeHotkey, selectedBuzzerGpio));', 1)
              s = s.replace('keyboardOnArm, buzzerGpio));   // v0.9.44', 'keyboardOnArm, selectedBuzzerGpio));   // v0.9.44', 1)
              p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- "$file"; then
            echo 'No exporter fix needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix: rename selected buzzer GPIO local'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Remove migration workflow
        if: always()
        shell: bash
        run: |
          echo 'Temporary workflow removes itself in the next cleanup commit.'
